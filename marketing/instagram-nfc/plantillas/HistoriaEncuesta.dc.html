<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #12D6DF; } a:hover { color: #2F6FEB; }
  </style>
</helmet>

<div style="width: 1080px; height: 1920px; position: relative; overflow: hidden; background: linear-gradient(200deg, #0B0F14 0%, #101B2C 58%, #0B0F14 100%); font-family: 'Inter', system-ui, sans-serif; color: #E7EEF6;">

  <div style="position: absolute; top: 420px; left: -260px; width: 780px; height: 780px; border-radius: 999px; background: radial-gradient(circle, {{accent}} 0%, rgba(11,15,20,0) 70%); opacity: 0.16;"></div>

  <div style="position: relative; height: 100%; display: flex; flex-direction: column; padding: 300px 90px 400px;">

    <div style="display: flex; flex-direction: column; gap: 48px;">
      <div style="display: flex; align-items: center; gap: 18px;">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round">
          <path d="M6.5 4.5a10.5 10.5 0 0 1 0 15"></path>
          <path d="M11 7.2a6 6 0 0 1 0 9.6"></path>
          <path d="M15.5 9.8a2.2 2.2 0 0 1 0 4.4"></path>
        </svg>
        <span style="font-size: 30px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: {{accent}};">Cuéntanos</span>
      </div>

      <h2 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 104px; line-height: 1.02; letter-spacing: -0.025em; text-wrap: pretty;">¿Sabías que tu celular ya lee NFC?</h2>

      <p style="margin: 0; font-size: 46px; line-height: 1.38; color: #93A5B9; text-wrap: pretty;">Respóndenos abajo 👇</p>
    </div>

    <div style="margin-top: auto; display: flex; align-items: center; gap: 20px;">
      <div style="width: 64px; height: 4px; border-radius: 999px; background: {{accent}};"></div>
      <span style="font-size: 32px; font-weight: 500; color: #93A5B9;">@nfc.ecuador</span>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#12D6DF","options":["#12D6DF","#2F6FEB","#E7EEF6"],"section":"Marca"},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#12D6DF' };
  }
}
</script>
</body>
</html>
