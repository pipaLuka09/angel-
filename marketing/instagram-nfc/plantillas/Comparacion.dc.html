<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #12D6DF; } a:hover { color: #2F6FEB; }
  </style>
</helmet>

<div style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #0B0F14; font-family: 'Inter', system-ui, sans-serif; color: #E7EEF6;">
  <div style="position: relative; height: 100%; display: flex; flex-direction: column; padding: 88px 80px; gap: 56px;">

    <h2 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 86px; line-height: 1.04; letter-spacing: -0.02em;">Papel <span style="color: #93A5B9;">vs.</span> NFC</h2>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; flex-grow: 1;">

      <div style="display: flex; flex-direction: column; gap: 36px; padding: 52px 44px; border-radius: 24px; background: #111820; border: 1px solid #1E2A38;">
        <div style="display: flex; align-items: center; gap: 18px;">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#93A5B9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 3.5h9l5 5v12H5z"></path>
            <path d="M14 3.5v5h5"></path>
          </svg>
          <span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 46px; font-weight: 700; color: #93A5B9;">Papel</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 26px;">
          <span style="font-size: 38px; line-height: 1.3; color: #93A5B9;">Se acaban</span>
          <span style="font-size: 38px; line-height: 1.3; color: #93A5B9;">Cambias de número, las botas</span>
          <span style="font-size: 38px; line-height: 1.3; color: #93A5B9;">Se dobla y se moja</span>
          <span style="font-size: 38px; line-height: 1.3; color: #93A5B9;">Nadie la guarda</span>
        </div>
        <div style="margin-top: auto; padding-top: 30px; border-top: 1px solid #1E2A38;">
          <span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 54px; font-weight: 700; color: #93A5B9;">$__ / año</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 36px; padding: 52px 44px; border-radius: 24px; background: #111820; border: 1px solid {{accent}}; box-shadow: 0 20px 45px -25px rgba(18, 214, 223, 0.55);">
        <div style="display: flex; align-items: center; gap: 18px;">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="5" width="19" height="14" rx="2.5"></rect>
            <path d="M9 10.5a4 4 0 0 1 0 3"></path>
            <path d="M12.5 8.8a7 7 0 0 1 0 6.4"></path>
            <path d="M16 7a10 10 0 0 1 0 10"></path>
          </svg>
          <span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 46px; font-weight: 700; color: {{accent}};">NFC</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 26px;">
          <span style="font-size: 38px; line-height: 1.3;">Una sola, para siempre</span>
          <span style="font-size: 38px; line-height: 1.3;">Cambias el link, no la tarjeta</span>
          <span style="font-size: 38px; line-height: 1.3;">El chip va sellado</span>
          <span style="font-size: 38px; line-height: 1.3;">Se guarda en el momento</span>
        </div>
        <div style="margin-top: auto; padding-top: 30px; border-top: 1px solid #1E2A38;">
          <span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 54px; font-weight: 700; color: {{accent}};">$__ una vez</span>
        </div>
      </div>

    </div>

    <span style="font-size: 30px; font-weight: 500; color: #93A5B9;">@nfc.ecuador</span>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#12D6DF","options":["#12D6DF","#2F6FEB","#E7EEF6"],"section":"Marca"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#12D6DF' };
  }
}
</script>
</body>
</html>
