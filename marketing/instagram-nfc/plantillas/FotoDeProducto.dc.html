<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #12D6DF; } a:hover { color: #4A85F5; }
  </style>
</helmet>

<div style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #0B0F14; font-family: 'Inter', system-ui, sans-serif; color: #E7EEF6;">

  <div style="position: absolute; inset: 0; background: #111820; display: flex; align-items: center; justify-content: center;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 28px; opacity: 0.75;">
      <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#93A5B9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.8" y="4.5" width="18.4" height="15" rx="2.4"></rect>
        <circle cx="9" cy="10" r="1.9"></circle>
        <path d="M3.2 16.8l4.6-4.2 4.1 3.7 3-2.6 5.9 5.1"></path>
      </svg>
      <span style="font-size: 34px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #93A5B9;">Reemplaza con tu foto</span>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,15,20,0.15) 0%, rgba(11,15,20,0.55) 45%, rgba(11,15,20,0.96) 100%);"></div>

  <div style="position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 88px 80px; gap: 36px;">
    <span style="font-size: 30px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: {{accent}};">Tarjeta NFC</span>
    <h2 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 96px; line-height: 1.03; letter-spacing: -0.02em; text-wrap: pretty;">La última tarjeta que vas a comprar</h2>
    <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 22px; border-top: 1px solid #1E2A38;">
      <span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 46px; font-weight: 700; color: {{accent}};">Desde $__</span>
      <span style="font-size: 30px; font-weight: 500; color: #93A5B9;">@nfc.ecuador</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#12D6DF","options":["#12D6DF","#4A85F5","#E7EEF6"],"section":"Marca"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#12D6DF' };
  }
}
</script>
</body>
</html>
