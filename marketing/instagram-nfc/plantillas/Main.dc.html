<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #12D6DF; } a:hover { color: #4A85F5; }
  </style>
</helmet>

<div style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: linear-gradient(135deg, #0B0F14 0%, #101B2C 55%, #0B0F14 100%); font-family: 'Inter', system-ui, sans-serif; color: #E7EEF6;">

  <div style="position: absolute; top: -220px; right: -180px; width: 700px; height: 700px; border-radius: 999px; background: radial-gradient(circle, {{accent}} 0%, rgba(11,15,20,0) 68%); opacity: 0.22;"></div>

  <div style="position: relative; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 88px 80px;">

    <div style="display: flex; flex-direction: column; gap: 44px;">
      <div style="display: flex; align-items: center; gap: 20px;">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round">
          <path d="M6.5 4.5a10.5 10.5 0 0 1 0 15"></path>
          <path d="M11 7.2a6 6 0 0 1 0 9.6"></path>
          <path d="M15.5 9.8a2.2 2.2 0 0 1 0 4.4"></path>
        </svg>
        <span style="font-size: 30px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: {{accent}};">Guía rápida</span>
      </div>

      <h1 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 108px; line-height: 1.02; letter-spacing: -0.02em; text-wrap: pretty;">Qué es una tarjeta NFC<br>(y qué <span style="color: {{accent}};">no</span> es)</h1>

      <div style="width: 160px; height: 8px; border-radius: 999px; background: {{accent}};"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 56px;">
      <p style="margin: 0; font-size: 44px; line-height: 1.4; font-weight: 400; color: #93A5B9; max-width: 820px;">Lo que hace, lo que no hace, y si sirve en tu celular.</p>

      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 18px; padding: 22px 38px; border-radius: 999px; border: 1px solid #1E2A38; background: #111820;">
          <span style="font-size: 32px; font-weight: 600; letter-spacing: 0.04em;">Desliza</span>
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h13"></path>
            <path d="M13 6l6 6-6 6"></path>
          </svg>
        </div>
        <span style="font-size: 32px; font-weight: 500; color: #93A5B9;">@nfc.ecuador</span>
      </div>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#12D6DF","options":["#12D6DF","#4A85F5","#E7EEF6"],"section":"Marca"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#12D6DF' };
  }
}
</script>
</body>
</html>
