<body>
<div id="hud">
  <p class="kicker">Acrílico NFC · Pagos</p>
  <h1>Paga acercando el celular</h1>
  <div class="rule"></div>
  <dl>
    <dt>Paso</dt><dd class="state" id="hud-state">En espera</dd>
    <dt>Cuenta</dt><dd id="hud-account">—</dd>
    <dt>Monto</dt><dd id="hud-amount">—</dd>

<three-d-stage name="pago-nfc" background="#f3f2f2"></three-d-stage>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

const B = {
  magenta:'#e5007e', deep:'#a8005d', dark:'#5c0033',
  ink:'#1a0d15', paper:'#fdf4f9', dim:'#8a7a83', ok:'#1f9d55'
};
const ACCOUNT = '2100 4487 91';
const HOLDER = 'XPRINT SOLUCIONES S.A.';
const AMOUNT = '48,90';
const two = n => String(n).padStart(2, '0');
const hhmm = d => two(d.getHours()) + ':' + two(d.getMinutes());

function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w/2, y = -h/2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function plate(w, h, r, d, mat, name, bevel) {
  const g = new THREE.ExtrudeGeometry(roundedRect(w, h, r), bevel
    ? { depth:d, bevelEnabled:true, bevelThickness:bevel, bevelSize:bevel, bevelSegments:4, curveSegments:24 }
    : { depth:d, bevelEnabled:false, curveSegments:24 });
  g.center();
  const m = new THREE.Mesh(g, mat); m.name = name; return m;
}
function screenCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  return { c, ctx: c.getContext('2d'), tex };
}
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function nfcWaves(ctx, cx, cy, r0, n, lw, color) {
  ctx.strokeStyle = color; ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    ctx.lineWidth = lw - i * (lw * 0.17);
    ctx.beginPath(); ctx.arc(cx, cy, r0 + i * r0 * 0.66, -0.88, 0.88); ctx.stroke();
  }
}

const MAT = {
  desk: new THREE.MeshStandardMaterial({ name:'counter_top', color:0xc9c6c2, roughness:0.60, metalness:0.10 }),
  accent: new THREE.MeshStandardMaterial({ name:'accent_red', color:0xec3013, roughness:0.40, metalness:0.05 }),
  acrylic: new THREE.MeshStandardMaterial({ name:'acrylic_clear', color:0xe7dfe4, roughness:0.14, metalness:0.05, transparent:true, opacity:0.40 }),
  acrylicBase: new THREE.MeshStandardMaterial({ name:'acrylic_base', color:0xe7dfe4, roughness:0.14, metalness:0.05, transparent:true, opacity:0.40 }),
  panelEdge: new THREE.MeshStandardMaterial({ name:'panel_stock', color:0xf6eef3, roughness:0.42, metalness:0.03 }),
  phoneBody: new THREE.MeshStandardMaterial({ name:'phone_body', color:0x1c1b1a, roughness:0.40, metalness:0.30 }),
  glass: new THREE.MeshStandardMaterial({ name:'phone_back_glass', color:0x24221f, roughness:0.25, metalness:0.40 }),
  pulse: new THREE.MeshStandardMaterial({ name:'nfc_pulse', color:0xe5007e, emissive:0xe5007e, emissiveIntensity:1.2, transparent:true, opacity:0.0, roughness:0.3 }),
};

const scene = new THREE.Group();
scene.name = 'pago_nfc_scene';

// ---- counter ----
const desk = new THREE.Mesh(new THREE.BoxGeometry(0.340, 0.016, 0.170), MAT.desk);
desk.name = 'counter_top'; desk.position.set(-0.020, 0.008, 0.045); scene.add(desk);
const deskEdge = new THREE.Mesh(new THREE.BoxGeometry(0.340, 0.004, 0.001), MAT.accent);
deskEdge.name = 'counter_edge'; deskEdge.position.set(-0.020, 0.014, 0.1305); scene.add(deskEdge);

// ---- acrylic block stand (thick wedge base + upright panel) ----
const blockBase = new THREE.Mesh(new THREE.BoxGeometry(0.112, 0.012, 0.056), MAT.acrylicBase);
blockBase.name = 'acrylic_base'; blockBase.position.set(-0.125, 0.024, 0.057); scene.add(blockBase);
const blockLip = new THREE.Mesh(new THREE.BoxGeometry(0.112, 0.012, 0.007), MAT.acrylic);
blockLip.name = 'acrylic_lip'; blockLip.position.set(-0.125, 0.036, 0.045); scene.add(blockLip);

// ---- magenta NFC payment panel ----
const PW = 0.100, PH = 0.140, PT = 0.006;
const panelRig = new THREE.Group(); panelRig.name = 'panel_rig';
panelRig.position.set(-0.125, 0.100, 0.035); panelRig.rotation.x = -0.10;
scene.add(panelRig);
panelRig.add(plate(PW, PH, 0.005, PT, MAT.panelEdge, 'panel_stock', 0.0008));

const cs = screenCanvas(700, 980);
const panelFaceMat = new THREE.MeshStandardMaterial({ name:'panel_print', map: cs.tex, roughness:0.30, metalness:0.04 });
const panelFace = new THREE.Mesh(new THREE.PlaneGeometry(PW - 0.0012, PH - 0.0012), panelFaceMat);
panelFace.name = 'panel_face'; panelFace.position.z = PT/2 + 0.0008; panelRig.add(panelFace);

const pulse = new THREE.Mesh(new THREE.TorusGeometry(0.021, 0.0015, 10, 56), MAT.pulse);
pulse.name = 'nfc_pulse_ring'; pulse.position.set(0, 0.006, PT/2 + 0.005); panelRig.add(pulse);

// ---- phone ----
const phoneRig = new THREE.Group(); phoneRig.name = 'phone_rig'; scene.add(phoneRig);
const phone = new THREE.Group(); phone.name = 'phone'; phoneRig.add(phone);
phone.add(plate(0.074, 0.152, 0.010, 0.0085, MAT.phoneBody, 'phone_body', 0.0012));
const phoneBack = new THREE.Mesh(new THREE.PlaneGeometry(0.066, 0.144), MAT.glass);
phoneBack.name = 'phone_back'; phoneBack.position.z = -0.0048; phoneBack.rotation.y = Math.PI; phone.add(phoneBack);
const camBump = plate(0.024, 0.024, 0.004, 0.002, MAT.glass, 'camera_bump', 0.0006);
camBump.position.set(-0.020, 0.055, -0.0055); phone.add(camBump);

const ps = screenCanvas(560, 1150);
const phoneScreenMat = new THREE.MeshStandardMaterial({
  name:'phone_screen', map: ps.tex, emissiveMap: ps.tex, emissive: 0xffffff,
  emissiveIntensity: 0.95, roughness: 0.2, metalness: 0.0
});
const phoneScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.067, 0.142), phoneScreenMat);
phoneScreen.name = 'phone_screen_glass'; phoneScreen.position.z = 0.0055; phone.add(phoneScreen);

scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
stage.setObject(scene);

// tighter framing than the stage's default: frame the product-and-phone pair
{
  const cam = stage._camera, ctl = stage._controls;
  const center = new THREE.Vector3(-0.03, 0.135, 0.045);
  const dist = (0.15 / Math.tan((cam.fov * Math.PI) / 360)) * 1.06;
  const dir = new THREE.Vector3(1, 0.55, 1.25).normalize();
  cam.position.copy(center).add(dir.multiplyScalar(dist));
  cam.near = Math.max(dist / 100, 0.005);
  cam.far = dist * 100;
  cam.updateProjectionMatrix();
  ctl.target.copy(center);
  ctl.update();
}

// ---------- acrylic panel artwork ----------
function paintPanel() {
  const { ctx, c, tex } = cs;
  ctx.fillStyle = B.magenta; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = B.deep; ctx.fillRect(0, 0, c.width, 176);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 176, c.width, 8);

  // logo slot — replace with the bank's own artwork
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 4;
  ctx.setLineDash([14, 10]);
  ctx.strokeRect(48, 44, 300, 92);
  ctx.setLineDash([]);
  ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.font = '700 22px Archivo, sans-serif';
  ctx.fillText('LOGO DEL BANCO', 68, 98);

  ctx.textAlign = 'right'; ctx.fillStyle = '#ffffff';
  ctx.font = '800 26px Archivo, sans-serif';
  ctx.fillText('PAGOS NFC', c.width - 48, 100);

  ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff';
  ctx.font = '800 62px Archivo, sans-serif';
  ctx.fillText('Paga aquí', 48, 290);
  ctx.font = '700 32px Archivo, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.fillText('acercando tu celular', 48, 340);

  nfcWaves(ctx, 190, 500, 40, 4, 22, '#ffffff');
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 13;
  rr(ctx, 320, 418, 106, 164, 18); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(320, 540); ctx.quadraticCurveTo(288, 604, 348, 622);
  ctx.lineTo(452, 622); ctx.quadraticCurveTo(490, 614, 474, 578);
  ctx.lineTo(436, 536); ctx.stroke();

  // account block
  ctx.fillStyle = '#ffffff'; ctx.fillRect(48, 700, c.width - 96, 168);
  ctx.fillStyle = B.dim; ctx.font = '700 22px Archivo, sans-serif';
  ctx.fillText('CUENTA DE AHORROS', 76, 748);
  ctx.fillStyle = B.ink; ctx.font = '800 44px Archivo, sans-serif';
  ctx.fillText(ACCOUNT, 76, 800);
  ctx.fillStyle = B.deep; ctx.font = '700 22px Archivo, sans-serif';
  ctx.fillText(HOLDER, 76, 840);

  ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.font = '800 24px Archivo, sans-serif';
  ctx.fillText('SIN DIGITAR LA CUENTA · SIN QR', c.width/2, 930);
  tex.needsUpdate = true;
}

// ---------- phone screens ----------
function statusBar(ctx, c, now, right, color) {
  ctx.fillStyle = color || B.dim; ctx.font = '600 22px Archivo, sans-serif';
  ctx.textAlign = 'left'; ctx.fillText(hhmm(now), 28, 40);
  ctx.textAlign = 'right'; ctx.fillText(right, c.width - 28, 40);
}
function checkMark(ctx, cx, cy, r, ring, tick) {
  ctx.strokeStyle = ring; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = tick; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - r*0.42, cy + r*0.02);
  ctx.lineTo(cx - r*0.10, cy + r*0.38);
  ctx.lineTo(cx + r*0.46, cy - r*0.34);
  ctx.stroke();
}
function shieldIcon(ctx, cx, cy, s, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx, cy - s);
  ctx.lineTo(cx + s * 0.78, cy - s * 0.62);
  ctx.quadraticCurveTo(cx + s * 0.78, cy + s * 0.62, cx, cy + s);
  ctx.quadraticCurveTo(cx - s * 0.78, cy + s * 0.62, cx - s * 0.78, cy - s * 0.62);
  ctx.closePath(); ctx.fill();
}

function paintPhone(state, now, k) {
  const { ctx, c, tex } = ps;

  if (state === 'nfc') {
    ctx.fillStyle = '#140a10'; ctx.fillRect(0, 0, c.width, c.height);
    statusBar(ctx, c, now, 'NFC');
    ctx.textAlign = 'center';
    ctx.strokeStyle = B.magenta; ctx.lineWidth = 8;
    for (let i = 0; i < 3; i++) {
      const r = 74 + i * 46 + Math.sin(k * Math.PI * 3) * 12;
      ctx.globalAlpha = 0.9 - i * 0.25;
      ctx.beginPath(); ctx.arc(c.width/2, 470, r, 0, Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffffff'; ctx.font = '800 34px Archivo, sans-serif';
    ctx.fillText('NFC', c.width/2, 484);
    ctx.font = '700 28px Archivo, sans-serif';
    ctx.fillText('Leyendo datos de pago…', c.width/2, 700);
    ctx.fillStyle = B.dim; ctx.font = '600 24px Archivo, sans-serif';
    ctx.fillText('CUENTA DE AHORROS', c.width/2, 744);
    ctx.strokeStyle = '#2a1a22'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(120, 820); ctx.lineTo(c.width - 120, 820); ctx.stroke();
    ctx.strokeStyle = B.magenta;
    ctx.beginPath(); ctx.moveTo(120, 820); ctx.lineTo(120 + (c.width - 240) * Math.min(1, k), 820); ctx.stroke();

  } else if (state === 'pay') {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = B.magenta; ctx.fillRect(0, 0, c.width, 240);
    statusBar(ctx, c, now, 'BANCA MÓVIL', 'rgba(255,255,255,0.8)');
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '700 22px Archivo, sans-serif';
    ctx.fillText('TRANSFERIR / PAGAR', 28, 96);
    ctx.fillStyle = '#ffffff'; ctx.font = '800 42px Archivo, sans-serif';
    ctx.fillText('Cuenta cargada', 28, 152);
    ctx.font = '700 24px Archivo, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText('Datos recibidos por NFC', 28, 196);

    ctx.fillStyle = B.dim; ctx.font = '700 22px Archivo, sans-serif';
    ctx.fillText('DESTINO', 28, 300);
    ctx.fillStyle = B.ink; ctx.font = '800 36px Archivo, sans-serif';
    ctx.fillText(ACCOUNT, 28, 348);
    ctx.fillStyle = B.deep; ctx.font = '700 23px Archivo, sans-serif';
    ctx.fillText(HOLDER, 28, 386);
    ctx.strokeStyle = '#eee2e9'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(28, 424); ctx.lineTo(c.width - 28, 424); ctx.stroke();

    ctx.fillStyle = B.dim; ctx.font = '700 22px Archivo, sans-serif';
    ctx.fillText('MONTO A PAGAR', 28, 486);
    ctx.fillStyle = B.ink; ctx.font = '800 76px Archivo, sans-serif';
    ctx.fillText('$ ' + AMOUNT, 28, 566);
    ctx.strokeStyle = '#eee2e9'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(28, 606); ctx.lineTo(c.width - 28, 606); ctx.stroke();

    ctx.fillStyle = B.dim; ctx.font = '700 22px Archivo, sans-serif';
    ctx.fillText('DESDE', 28, 664);
    ctx.fillStyle = B.ink; ctx.font = '700 28px Archivo, sans-serif';
    ctx.fillText('Ahorros ····8102', 28, 704);

    shieldIcon(ctx, 44, 776, 16, '#c9b6c1');
    ctx.fillStyle = '#8a7a83'; ctx.font = '600 22px Archivo, sans-serif';
    ctx.fillText('Confirma con tu huella', 70, 784);

    const held = k > 0.60;
    ctx.fillStyle = held ? B.deep : B.magenta;
    ctx.fillRect(28, 872, c.width - 56, 96);
    ctx.fillStyle = '#ffffff'; ctx.font = '800 30px Archivo, sans-serif';
    ctx.fillText(held ? 'AUTORIZANDO…' : 'PAGAR AHORA', 56, 930);
    ctx.strokeStyle = '#eee2e9'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(28, 1010); ctx.lineTo(c.width - 28, 1010); ctx.stroke();
    if (held) {
      ctx.strokeStyle = B.magenta;
      ctx.beginPath(); ctx.moveTo(28, 1010);
      ctx.lineTo(28 + (c.width - 56) * Math.min(1, (k - 0.60) / 0.40), 1010); ctx.stroke();
    }

  } else if (state === 'done') {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = B.magenta; ctx.fillRect(0, 0, c.width, 150);
    statusBar(ctx, c, now, 'BANCA MÓVIL', 'rgba(255,255,255,0.8)');
    ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff'; ctx.font = '800 38px Archivo, sans-serif';
    ctx.fillText('Comprobante', 28, 118);

    ctx.textAlign = 'center';
    checkMark(ctx, c.width/2, 320, 76, '#f5dbe8', B.ok);
    ctx.fillStyle = B.ink; ctx.font = '800 42px Archivo, sans-serif';
    ctx.fillText('Pago enviado', c.width/2, 458);
    ctx.fillStyle = B.ink; ctx.font = '800 62px Archivo, sans-serif';
    ctx.fillText('$ ' + AMOUNT, c.width/2, 542);

    ctx.textAlign = 'left';
    let y = 636;
    const rows = [['A', HOLDER], ['CUENTA', ACCOUNT], ['HORA', hhmm(now)], ['COMPROBANTE', 'NFC-77401326']];
    for (const [label, val] of rows) {
      ctx.fillStyle = B.dim; ctx.font = '700 21px Archivo, sans-serif';
      ctx.fillText(label, 28, y);
      ctx.textAlign = 'right'; ctx.fillStyle = B.ink; ctx.font = '700 25px Archivo, sans-serif';
      ctx.fillText(val, c.width - 28, y);
      ctx.textAlign = 'left';
      ctx.strokeStyle = '#eee2e9'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(28, y + 26); ctx.lineTo(c.width - 28, y + 26); ctx.stroke();
      y += 78;
    }
    ctx.fillStyle = B.magenta; ctx.fillRect(28, 968, c.width - 56, 88);
    ctx.fillStyle = '#ffffff'; ctx.font = '800 28px Archivo, sans-serif';
    ctx.fillText('COMPARTIR COMPROBANTE', 56, 1022);

  } else {
    ctx.fillStyle = '#140a10'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.textAlign = 'center'; ctx.fillStyle = '#f3f2f2';
    ctx.font = '700 132px Archivo, sans-serif'; ctx.fillText(hhmm(now), c.width/2, 300);
    ctx.fillStyle = B.dim; ctx.font = '600 26px Archivo, sans-serif';
    ctx.fillText(now.toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' }).toUpperCase(), c.width/2, 350);
    ctx.fillStyle = '#2a1a22'; ctx.fillRect(40, 940, c.width - 80, 120);
    ctx.fillStyle = '#9aa0a6'; ctx.font = '600 24px Archivo, sans-serif';
    ctx.fillText('NFC activado', c.width/2, 1010);
  }
  tex.needsUpdate = true;
}

// ---------- animation ----------
const hudState = document.getElementById('hud-state');
const hudAccount = document.getElementById('hud-account');
const hudAmount = document.getElementById('hud-amount');
const CYCLE = 15.0, T_IN = 2.2, T_NFC = 3.9, T_PAY = 9.6, T_DONE = 13.8, T_OUT = 14.5;
const ease = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
const FAR = new THREE.Vector3(0.140, 0.150, 0.020);
const TAP = new THREE.Vector3(-0.125, 0.1234, 0.0473);
const READ = new THREE.Vector3(0.058, 0.150, 0.045);
let last = '';

function frame(ms) {
  const t = (ms / 1000) % CYCLE;
  const now = new Date();
  let p, rx, ry, state, k = 0;

  if (t < T_IN) {
    k = ease(t / T_IN);
    p = FAR.clone().lerp(TAP, k);
    rx = -0.55 + 0.45 * k; ry = 0.45 - 0.44 * k; state = 'idle';
  } else if (t < T_NFC) {
    k = (t - T_IN) / (T_NFC - T_IN);
    p = TAP.clone(); p.z += Math.sin(k * Math.PI) * 0.004;
    rx = -0.10; ry = 0.01; state = 'nfc';
  } else if (t < T_PAY) {
    k = (t - T_NFC) / (T_PAY - T_NFC);
    const e = ease(Math.min(1, k * 1.9));
    p = TAP.clone().lerp(READ, e);
    rx = -0.10 - 0.32 * e; ry = 0.14 * e; state = 'pay';
  } else if (t < T_DONE) {
    k = (t - T_PAY) / (T_DONE - T_PAY);
    p = READ.clone(); p.y += Math.sin(k * Math.PI) * 0.004;
    rx = -0.42; ry = 0.14; state = 'done';
  } else if (t < T_OUT) {
    k = ease((t - T_DONE) / (T_OUT - T_DONE));
    p = READ.clone().lerp(FAR, k);
    rx = -0.42 - 0.13 * k; ry = 0.14 + 0.31 * k; state = 'done'; k = 1;
  } else {
    p = FAR.clone(); rx = -0.55; ry = 0.45; state = 'idle';
  }

  phoneRig.position.copy(p);
  phone.rotation.set(rx, ry, Math.sin(ms / 1300) * 0.02);
  paintPhone(state, now, k);

  const glow = state === 'nfc' ? 0.55 + 0.45 * Math.sin(k * Math.PI * 4) : 0;
  MAT.pulse.opacity = glow;
  pulse.scale.setScalar(1 + (state === 'nfc' ? k * 0.5 : 0));

  if (state !== last) {
    last = state;
    hudState.textContent = state === 'nfc' ? 'Conexión NFC' : state === 'pay' ? 'Cuenta cargada'
      : state === 'done' ? 'Pago enviado' : 'En espera';
    hudState.style.color = state === 'idle' ? 'var(--color-text)' : 'var(--color-accent-700)';
    hudAccount.textContent = state === 'idle' || state === 'nfc' ? '—' : ACCOUNT;
    hudAmount.textContent = state === 'pay' || state === 'done' ? '$ ' + AMOUNT : '—';
  }
}
paintPanel();
paintPhone('idle', new Date(), 0);
document.fonts.ready.then(() => { paintPanel(); });
phoneScreen.onBeforeRender = () => { try { frame(performance.now()); } catch (e) { console.error(e); } };
requestAnimationFrame(function tick(ms){ try { frame(ms); } catch (e) { console.error(e); } requestAnimationFrame(tick); });
</script>
</body>
