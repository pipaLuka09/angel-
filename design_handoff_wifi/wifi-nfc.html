<html lang="es">

<meta charset="utf-8">

<link rel="stylesheet" href="_ds/modernist-4e39d72f-67e8-4c3c-a4f8-011aa3009942/styles.css">

    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"

<style>
  html,body{margin:0;height:100%;background:var(--color-bg);font-family:var(--font-body)}
  three-d-stage:not(:defined){visibility:hidden}
  #hud{position:fixed;left:0;top:0;z-index:10;padding:20px 24px;pointer-events:none;max-width:340px}
  #hud .kicker{font-family:var(--font-heading);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 6px}
  #hud h1{font-family:var(--font-heading);font-size:22px;line-height:1.1;margin:0 0 12px;color:var(--color-text)}

  #hud dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px;color:var(--color-text)}
  #hud dt{font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.08em;font-size:11px;opacity:.6}
  #hud dd{margin:0;font-variant-numeric:tabular-nums}
  #hud .state{font-family:var(--font-heading);font-weight:700}

</head>
<body>
<div id="hud">
  <p class="kicker">Tarjeta NFC · Wi-Fi</p>
  <h1>Conéctate sin contraseña</h1>
  <div class="rule"></div>
  <dl>
    <dt>Paso</dt><dd class="state" id="hud-state">En espera</dd>
    <dt>Red</dt><dd id="hud-net">—</dd>
    <dt>Señal</dt><dd id="hud-signal">—</dd>
  </dl>
</div>
<three-d-stage name="wifi-nfc" background="#f3f2f2"></three-d-stage>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

const B = { cyan:'#17c3e0', deep:'#0b6d80', ink:'#0f1c20', paper:'#eef7f9', dim:'#8a9296', ok:'#1f9d55' };
const SSID = 'XPRINT_INVITADOS';
const two = n => String(n).padStart(2, '0');
const hhmm = d => two(d.getHours()) + ':' + two(d.getMinutes());

function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w/2, y = -h/2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function plate(w, h, r, d, mat, name, bevel) {
  const g = new THREE.ExtrudeGeometry(roundedRect(w, h, r), bevel
    ? { depth:d, bevelEnabled:true, bevelThickness:bevel, bevelSize:bevel, bevelSegments:4, curveSegments:24 }
    : { depth:d, bevelEnabled:false, curveSegments:24 });
  g.center();
  const m = new THREE.Mesh(g, mat); m.name = name; return m;
}
function screenCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  return { c, ctx: c.getContext('2d'), tex };
}
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wifiGlyph(ctx, cx, cy, r0, lw, color, arcs = 3, dot = true) {
  ctx.strokeStyle = color; ctx.lineCap = 'round';
  for (let i = 0; i < arcs; i++) {
    ctx.lineWidth = lw - i * (lw * 0.14);
    ctx.beginPath();
    ctx.arc(cx, cy, r0 + i * r0 * 0.78, Math.PI * 1.22, Math.PI * 1.78);
    ctx.stroke();
  }
  if (dot) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(cx, cy, lw * 0.62, 0, Math.PI*2); ctx.fill(); }
}

const MAT = {
  desk: new THREE.MeshStandardMaterial({ name:'desk_top', color:0xc9c6c2, roughness:0.60, metalness:0.10 }),
  accent: new THREE.MeshStandardMaterial({ name:'accent_red', color:0xec3013, roughness:0.40, metalness:0.05 }),
  acrylic: new THREE.MeshStandardMaterial({ name:'acrylic_clear', color:0xdfe3e2, roughness:0.15, metalness:0.05, transparent:true, opacity:0.42 }),
  cardEdge: new THREE.MeshStandardMaterial({ name:'card_stock', color:0xf4f3f1, roughness:0.42, metalness:0.03 }),
  routerBody: new THREE.MeshStandardMaterial({ name:'router_body', color:0x24262a, roughness:0.55, metalness:0.15 }),
  routerTop: new THREE.MeshStandardMaterial({ name:'router_top', color:0x2f3237, roughness:0.40, metalness:0.20 }),
  led: new THREE.MeshStandardMaterial({ name:'router_led', color:0x17c3e0, emissive:0x17c3e0, emissiveIntensity:1.1, roughness:0.3 }),
  phoneBody: new THREE.MeshStandardMaterial({ name:'phone_body', color:0x1c1b1a, roughness:0.40, metalness:0.30 }),
  glass: new THREE.MeshStandardMaterial({ name:'phone_back_glass', color:0x24221f, roughness:0.25, metalness:0.40 }),
  pulse: new THREE.MeshStandardMaterial({ name:'nfc_pulse', color:0x17c3e0, emissive:0x17c3e0, emissiveIntensity:1.2, transparent:true, opacity:0.0, roughness:0.3 }),
};

const scene = new THREE.Group();
scene.name = 'wifi_nfc_scene';

// ---- desk ----
const desk = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.020, 0.26), MAT.desk);
desk.name = 'desk_top'; desk.position.set(0, 0.010, 0.02); scene.add(desk);
const deskEdge = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.004, 0.001), MAT.accent);
deskEdge.name = 'desk_edge'; deskEdge.position.set(0, 0.018, 0.1505); scene.add(deskEdge);

// ---- router behind the card ----
const router = new THREE.Group(); router.name = 'router';
router.position.set(0.115, 0.020, -0.070); scene.add(router);
const routerBase = new THREE.Mesh(new THREE.BoxGeometry(0.086, 0.014, 0.086), MAT.routerBody);
routerBase.name = 'router_base';
routerBase.position.set(0, 0.007, 0);
router.add(routerBase);
const routerSlab = new THREE.Mesh(new THREE.BoxGeometry(0.078, 0.052, 0.026), MAT.routerTop);
routerSlab.name = 'router_slab'; routerSlab.position.set(0, 0.040, 0); router.add(routerSlab);
for (const [x, rz] of [[-0.044, 0.30], [0.044, -0.30]]) {
  const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.0035, 0.0035, 0.075, 12), MAT.routerBody);
  ant.name = 'router_antenna_' + (x < 0 ? 'l' : 'r');
  ant.position.set(x, 0.058, -0.006); ant.rotation.z = rz; router.add(ant);
}
const routerLed = new THREE.Mesh(new THREE.CircleGeometry(0.004, 24), MAT.led);
routerLed.name = 'router_led'; routerLed.position.set(0, 0.040, 0.0132); router.add(routerLed);

// ---- acrylic stand + Wi-Fi card ----
const standFoot = new THREE.Mesh(new THREE.BoxGeometry(0.094, 0.004, 0.062), MAT.acrylic);
standFoot.name = 'stand_foot'; standFoot.position.set(-0.062, 0.024, -0.008); scene.add(standFoot);
const standPanel = new THREE.Mesh(new THREE.BoxGeometry(0.094, 0.128, 0.003), MAT.acrylic);
standPanel.name = 'stand_panel';
standPanel.position.set(-0.062, 0.086, -0.036); standPanel.rotation.x = -0.12; scene.add(standPanel);
const standLip = new THREE.Mesh(new THREE.BoxGeometry(0.094, 0.010, 0.006), MAT.acrylic);
standLip.name = 'stand_lip'; standLip.position.set(-0.062, 0.028, -0.024); scene.add(standLip);

const CW = 0.086, CH = 0.122, CT = 0.0022;
const cardRig = new THREE.Group(); cardRig.name = 'card_rig';
cardRig.position.set(-0.062, 0.088, -0.0315); cardRig.rotation.x = -0.12;
scene.add(cardRig);
cardRig.add(plate(CW, CH, 0.006, CT, MAT.cardEdge, 'card_stock', 0.0005));

const cs = screenCanvas(688, 976);
const cardFaceMat = new THREE.MeshStandardMaterial({ name:'card_print', map: cs.tex, roughness:0.38, metalness:0.02 });
const cardFace = new THREE.Mesh(new THREE.PlaneGeometry(CW - 0.001, CH - 0.001), cardFaceMat);
cardFace.name = 'card_face'; cardFace.position.z = CT/2 + 0.0006; cardRig.add(cardFace);

const pulse = new THREE.Mesh(new THREE.TorusGeometry(0.019, 0.0014, 10, 56), MAT.pulse);
pulse.name = 'nfc_pulse_ring'; pulse.position.set(0, 0.004, CT/2 + 0.004); cardRig.add(pulse);

// ---- phone ----
const phoneRig = new THREE.Group(); phoneRig.name = 'phone_rig'; scene.add(phoneRig);
const phone = new THREE.Group(); phone.name = 'phone'; phoneRig.add(phone);
phone.add(plate(0.074, 0.152, 0.010, 0.0085, MAT.phoneBody, 'phone_body', 0.0012));
const phoneBack = new THREE.Mesh(new THREE.PlaneGeometry(0.066, 0.144), MAT.glass);
phoneBack.name = 'phone_back'; phoneBack.position.z = -0.0048; phoneBack.rotation.y = Math.PI; phone.add(phoneBack);
const camBump = plate(0.024, 0.024, 0.004, 0.002, MAT.glass, 'camera_bump', 0.0006);
camBump.position.set(-0.020, 0.055, -0.0055); phone.add(camBump);

const ps = screenCanvas(560, 1150);
const phoneScreenMat = new THREE.MeshStandardMaterial({
  name:'phone_screen', map: ps.tex, emissiveMap: ps.tex, emissive: 0xffffff,
  emissiveIntensity: 0.95, roughness: 0.2, metalness: 0.0
});
const phoneScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.067, 0.142), phoneScreenMat);
phoneScreen.name = 'phone_screen_glass'; phoneScreen.position.z = 0.0055; phone.add(phoneScreen);

scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
stage.setObject(scene);

// ---------- card artwork ----------
function paintCard() {
  const { ctx, c, tex } = cs;
  ctx.fillStyle = B.paper; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = B.ink; ctx.fillRect(0, 0, c.width, 214);
  ctx.fillStyle = B.cyan; ctx.fillRect(0, 214, c.width, 10);

  ctx.textAlign = 'left'; ctx.fillStyle = B.cyan;
  ctx.font = '800 26px Archivo, sans-serif';
  ctx.fillText('WI-FI CON NFC', 48, 76);
  ctx.fillStyle = '#ffffff'; ctx.font = '800 54px Archivo, sans-serif';
  ctx.fillText('Conéctate', 48, 140);
  ctx.fillText('sin contraseña', 48, 194);

  wifiGlyph(ctx, c.width/2, 470, 62, 30, B.deep, 3);

  ctx.textAlign = 'center'; ctx.fillStyle = B.ink;
  ctx.font = '800 40px Archivo, sans-serif';
  ctx.fillText('ACERCA TU CELULAR', c.width/2, 610);
  ctx.fillStyle = '#5c6a6e'; ctx.font = '700 28px Archivo, sans-serif';
  ctx.fillText('a esta tarjeta y listo', c.width/2, 654);

  ctx.strokeStyle = B.cyan; ctx.lineWidth = 6;
  ctx.strokeRect(48, 716, c.width - 96, 120);
  ctx.fillStyle = '#5c6a6e'; ctx.font = '700 24px Archivo, sans-serif';
  ctx.textAlign = 'left'; ctx.fillText('RED', 74, 764);
  ctx.fillStyle = B.ink; ctx.font = '800 36px Archivo, sans-serif';
  ctx.fillText(SSID, 74, 810);

  ctx.textAlign = 'center'; ctx.fillStyle = B.deep;
  ctx.font = '800 24px Archivo, sans-serif';
  ctx.fillText('SIN ESCRIBIR NADA · SIN QR', c.width/2, 908);
  tex.needsUpdate = true;
}

// ---------- phone screens ----------
function statusBar(ctx, c, now, right, color) {
  ctx.fillStyle = color || B.dim; ctx.font = '600 22px Archivo, sans-serif';
  ctx.textAlign = 'left'; ctx.fillText(hhmm(now), 28, 40);
  ctx.textAlign = 'right'; ctx.fillText(right, c.width - 28, 40);
}
function checkMark(ctx, cx, cy, r, ring, tick) {
  ctx.strokeStyle = ring; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = tick; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - r*0.42, cy + r*0.02);
  ctx.lineTo(cx - r*0.10, cy + r*0.38);
  ctx.lineTo(cx + r*0.46, cy - r*0.34);
  ctx.stroke();
}
function lockIcon(ctx, cx, cy, s, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.arc(cx, cy - s * 0.42, s * 0.42, Math.PI, 0); ctx.stroke();
  rr(ctx, cx - s * 0.66, cy - s * 0.06, s * 1.32, s * 0.94, s * 0.16);
  ctx.fillStyle = color; ctx.fill();
}

function paintPhone(state, now, k) {
  const { ctx, c, tex } = ps;

  if (state === 'nfc') {
    ctx.fillStyle = '#0a1418'; ctx.fillRect(0, 0, c.width, c.height);
    statusBar(ctx, c, now, 'NFC');
    ctx.textAlign = 'center';
    ctx.strokeStyle = B.cyan; ctx.lineWidth = 8;
    for (let i = 0; i < 3; i++) {
      const r = 74 + i * 46 + Math.sin(k * Math.PI * 3) * 12;
      ctx.globalAlpha = 0.9 - i * 0.25;
      ctx.beginPath(); ctx.arc(c.width/2, 470, r, 0, Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    wifiGlyph(ctx, c.width/2, 500, 26, 13, '#ffffff', 3);
    ctx.fillStyle = '#ffffff'; ctx.font = '700 28px Archivo, sans-serif';
    ctx.fillText('Leyendo la tarjeta…', c.width/2, 700);
    ctx.fillStyle = B.dim; ctx.font = '600 24px Archivo, sans-serif';
    ctx.fillText('CONFIGURACIÓN WI-FI', c.width/2, 744);
    ctx.strokeStyle = '#1e2a2e'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(120, 820); ctx.lineTo(c.width - 120, 820); ctx.stroke();
    ctx.strokeStyle = B.cyan;
    ctx.beginPath(); ctx.moveTo(120, 820); ctx.lineTo(120 + (c.width - 240) * Math.min(1, k), 820); ctx.stroke();

  } else if (state === 'joining') {
    ctx.fillStyle = '#0a1418'; ctx.fillRect(0, 0, c.width, c.height);
    statusBar(ctx, c, now, 'WI-FI');
    ctx.textAlign = 'center';
    // growing signal arcs
    const arcs = 1 + Math.floor(Math.min(0.999, k) * 3);
    wifiGlyph(ctx, c.width/2, 520, 46, 22, B.cyan, arcs);
    ctx.fillStyle = '#ffffff'; ctx.font = '800 34px Archivo, sans-serif';
    ctx.fillText(SSID, c.width/2, 700);
    ctx.fillStyle = B.dim; ctx.font = '600 26px Archivo, sans-serif';
    ctx.fillText('Conectando…', c.width/2, 748);
    ctx.strokeStyle = '#1e2a2e'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(120, 820); ctx.lineTo(c.width - 120, 820); ctx.stroke();
    ctx.strokeStyle = B.cyan;
    ctx.beginPath(); ctx.moveTo(120, 820); ctx.lineTo(120 + (c.width - 240) * Math.min(1, k), 820); ctx.stroke();

  } else if (state === 'done') {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = B.ink; ctx.fillRect(0, 0, c.width, 150);
    statusBar(ctx, c, now, 'WI-FI', '#8a9296');
    ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff';
    ctx.font = '800 38px Archivo, sans-serif';
    ctx.fillText('Wi-Fi', 28, 118);

    ctx.textAlign = 'center';
    checkMark(ctx, c.width/2, 330, 78, '#d8ecef', B.ok);
    ctx.fillStyle = B.ink; ctx.font = '800 40px Archivo, sans-serif';
    ctx.fillText('¡Conectado!', c.width/2, 470);
    ctx.fillStyle = '#5c6a6e'; ctx.font = '600 26px Archivo, sans-serif';
    ctx.fillText('Sin escribir la contraseña', c.width/2, 512);

    // connected network row
    ctx.strokeStyle = '#e2e8e9'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(28, 578); ctx.lineTo(c.width - 28, 578); ctx.stroke();
    wifiGlyph(ctx, 64, 646, 15, 8, B.ok, 3);
    ctx.textAlign = 'left'; ctx.fillStyle = B.ink; ctx.font = '800 30px Archivo, sans-serif';
    ctx.fillText(SSID, 112, 634);
    ctx.fillStyle = B.ok; ctx.font = '700 23px Archivo, sans-serif';
    ctx.fillText('Conectado · señal excelente', 112, 668);
    lockIcon(ctx, c.width - 52, 646, 17, '#9aa6a9');
    ctx.strokeStyle = '#e2e8e9'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(28, 706); ctx.lineTo(c.width - 28, 706); ctx.stroke();

    // other networks, greyed
    let y = 780;
    for (const n of ['CAFE_VECINO', 'INFINITUM_4G21', 'OFICINA_2']) {
      wifiGlyph(ctx, 64, y + 4, 13, 7, '#b6c0c3', 2, false);
      ctx.fillStyle = '#8a9296'; ctx.font = '600 27px Archivo, sans-serif';
      ctx.fillText(n, 112, y + 12);
      lockIcon(ctx, c.width - 52, y + 6, 15, '#c3cbcd');
      y += 82;
    }
    ctx.fillStyle = '#b6c0c3'; ctx.font = '600 22px Archivo, sans-serif';
    ctx.fillText('Configurado por NFC desde la tarjeta', 28, 1058);

  } else {
    ctx.fillStyle = '#0a1418'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.textAlign = 'center'; ctx.fillStyle = '#f3f2f2';
    ctx.font = '700 132px Archivo, sans-serif'; ctx.fillText(hhmm(now), c.width/2, 300);
    ctx.fillStyle = B.dim; ctx.font = '600 26px Archivo, sans-serif';
    ctx.fillText(now.toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' }).toUpperCase(), c.width/2, 350);
    ctx.fillStyle = '#16232a'; ctx.fillRect(40, 940, c.width - 80, 120);
    ctx.fillStyle = '#9aa0a6'; ctx.font = '600 24px Archivo, sans-serif';
    ctx.fillText('NFC activado · Wi-Fi buscando', c.width/2, 1010);
  }
  tex.needsUpdate = true;
}

// ---------- animation ----------
const hudState = document.getElementById('hud-state');
const hudNet = document.getElementById('hud-net');
const hudSignal = document.getElementById('hud-signal');
const CYCLE = 12.0, T_IN = 2.0, T_NFC = 3.6, T_JOIN = 5.2, T_DONE = 10.8, T_OUT = 11.6;
const ease = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
const FAR = new THREE.Vector3(0.115, 0.140, 0.200);
const TAP = new THREE.Vector3(-0.062, 0.112, -0.0218);
const READ = new THREE.Vector3(0.045, 0.150, 0.130);
let last = '';

function frame(ms) {
  const t = (ms / 1000) % CYCLE;
  const now = new Date();
  let p, rx, ry, state, k = 0;

  if (t < T_IN) {
    k = ease(t / T_IN);
    p = FAR.clone().lerp(TAP, k);
    rx = -0.55 + 0.43 * k; ry = 0.45 - 0.44 * k; state = 'idle';
  } else if (t < T_NFC) {
    k = (t - T_IN) / (T_NFC - T_IN);
    p = TAP.clone(); p.z += Math.sin(k * Math.PI) * 0.004;
    rx = -0.12; ry = 0.01; state = 'nfc';
  } else if (t < T_JOIN) {
    k = (t - T_NFC) / (T_JOIN - T_NFC);
    const e = ease(Math.min(1, k * 1.5));
    p = TAP.clone().lerp(READ, e);
    rx = -0.12 - 0.30 * e; ry = 0.14 * e; state = 'joining';
  } else if (t < T_DONE) {
    k = (t - T_JOIN) / (T_DONE - T_JOIN);
    p = READ.clone(); p.y += Math.sin(k * Math.PI) * 0.004;
    rx = -0.42; ry = 0.14; state = 'done';
  } else if (t < T_OUT) {
    k = ease((t - T_DONE) / (T_OUT - T_DONE));
    p = READ.clone().lerp(FAR, k);
    rx = -0.42 - 0.13 * k; ry = 0.14 + 0.31 * k; state = 'done'; k = 1;
  } else {
    p = FAR.clone(); rx = -0.55; ry = 0.45; state = 'idle';
  }

  phoneRig.position.copy(p);
  phone.rotation.set(rx, ry, Math.sin(ms / 1300) * 0.02);
  paintPhone(state, now, k);

  const glow = state === 'nfc' ? 0.55 + 0.45 * Math.sin(k * Math.PI * 4) : 0;
  MAT.pulse.opacity = glow;
  pulse.scale.setScalar(1 + (state === 'nfc' ? k * 0.5 : 0));

  const linked = state === 'joining' || state === 'done';
  MAT.led.emissiveIntensity = linked ? 1.6 : 0.5 + 0.3 * Math.sin(ms / 700);

  if (state !== last) {
    last = state;
    hudState.textContent = state === 'nfc' ? 'Conexión NFC' : state === 'joining' ? 'Conectando'
      : state === 'done' ? 'Conectado' : 'En espera';
    hudState.style.color = state === 'idle' ? 'var(--color-text)' : 'var(--color-accent-700)';
    hudNet.textContent = state === 'idle' ? '—' : SSID;
    hudSignal.textContent = state === 'done' ? 'Excelente' : state === 'joining' ? 'Enlazando…' : '—';
  }
}
paintCard();
paintPhone('idle', new Date(), 0);
document.fonts.ready.then(() => { paintCard(); });
phoneScreen.onBeforeRender = () => { try { frame(performance.now()); } catch (e) { console.error(e); } };
requestAnimationFrame(function tick(ms){ try { frame(ms); } catch (e) { console.error(e); } requestAnimationFrame(tick); });
</script>
