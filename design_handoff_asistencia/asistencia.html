<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Simulación — marcado de asistencia</title>
<link rel="stylesheet" href="_ds/modernist-4e39d72f-67e8-4c3c-a4f8-011aa3009942/styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html,body{margin:0;height:100%;background:var(--color-bg);font-family:var(--font-body)}
  three-d-stage:not(:defined){visibility:hidden}
  #hud{position:fixed;left:0;top:0;z-index:10;padding:20px 24px;pointer-events:none;max-width:360px}
  #hud .kicker{font-family:var(--font-heading);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 6px}
  #hud h1{font-family:var(--font-heading);font-size:22px;line-height:1.1;margin:0 0 12px;color:var(--color-text)}
  #hud .rule{height:2px;background:var(--color-divider);margin:0 0 12px}
  #hud dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px;color:var(--color-text)}
  #hud dt{font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.08em;font-size:11px;opacity:.6}
  #hud dd{margin:0;font-variant-numeric:tabular-nums}
  #hud .state{font-family:var(--font-heading);font-weight:700}
</style>
</head>
<body>
<div id="hud">
  <p class="kicker">Xprint · Control de acceso</p>
  <h1>Marcado de asistencia</h1>
  <div class="rule"></div>
  <dl>
    <dt>Hora</dt><dd id="hud-clock">--:--:--</dd>
    <dt>Estado</dt><dd class="state" id="hud-state">En espera</dd>
    <dt>Entrada</dt><dd id="hud-in">—</dd>
    <dt>Portador</dt><dd>Ayudante / Operador A</dd>
  </dl>
</div>
<three-d-stage name="marcado-asistencia" background="#f3f2f2"></three-d-stage>
<script src="three-d-stage.js"></script>
<script type="module">
import { buildBadge } from './badge-model.js';

const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

const ACCENT = 0xec3013, INK = 0x201e1d, PAPER = 0xf3f2f2;
const two = n => String(n).padStart(2, '0');
const hhmm = d => two(d.getHours()) + ':' + two(d.getMinutes());
const hhmmss = d => hhmm(d) + ':' + two(d.getSeconds());

function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w/2, y = -h/2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function plate(w, h, r, d, mat, name, bevel) {
  const g = new THREE.ExtrudeGeometry(roundedRect(w, h, r), bevel
    ? { depth:d, bevelEnabled:true, bevelThickness:bevel, bevelSize:bevel, bevelSegments:4, curveSegments:24 }
    : { depth:d, bevelEnabled:false, curveSegments:24 });
  g.center();
  const m = new THREE.Mesh(g, mat); m.name = name; return m;
}
function screenCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  return { c, ctx: c.getContext('2d'), tex };
}

const MAT = {
  caseDark: new THREE.MeshStandardMaterial({ name:'terminal_case', color:0x2a2827, roughness:0.55, metalness:0.15 }),
  caseLight: new THREE.MeshStandardMaterial({ name:'terminal_bezel', color:0xdedbd8, roughness:0.5, metalness:0.1 }),
  wall: new THREE.MeshStandardMaterial({ name:'wall_panel', color:0xe6e4e1, roughness:0.95, metalness:0.0 }),
  accent: new THREE.MeshStandardMaterial({ name:'accent_red', color:ACCENT, roughness:0.4, metalness:0.05 }),
  phoneBody: new THREE.MeshStandardMaterial({ name:'phone_body', color:0x1c1b1a, roughness:0.4, metalness:0.3 }),
  stand: new THREE.MeshStandardMaterial({ name:'phone_stand', color:0xc9c6c2, roughness:0.6, metalness:0.1 }),
  led: new THREE.MeshStandardMaterial({ name:'led', color:0x333030, emissive:0x000000, roughness:0.3 }),
};

const scene = new THREE.Group();
scene.name = 'attendance_scene';

// ---- counter plinth ----
const plinth = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.022, 0.20), MAT.stand);
plinth.name = 'counter_top';
plinth.position.set(0.03, 0.011, 0.01);
scene.add(plinth);
const plinthEdge = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.004, 0.001), MAT.accent);
plinthEdge.name = 'counter_edge';
plinthEdge.position.set(0.03, 0.020, 0.1105);
scene.add(plinthEdge);

// ---- reader terminal on its post ----
const post = new THREE.Mesh(new THREE.BoxGeometry(0.048, 0.130, 0.048), MAT.caseDark);
post.name = 'reader_post';
post.position.set(-0.08, 0.087, -0.03);
scene.add(post);

const reader = new THREE.Group(); reader.name = 'reader_terminal';
reader.position.set(-0.08, 0.235, -0.012);
reader.rotation.x = -0.22;
scene.add(reader);

const body = plate(0.135, 0.200, 0.008, 0.038, MAT.caseDark, 'reader_body', 0.002);
body.position.z = -0.019; reader.add(body);
const bezel = plate(0.118, 0.182, 0.006, 0.004, MAT.caseLight, 'reader_bezel');
bezel.position.z = 0.0015; reader.add(bezel);

const rs = screenCanvas(512, 320);
const screenMat = new THREE.MeshStandardMaterial({
  name:'reader_screen', map: rs.tex, emissiveMap: rs.tex, emissive: 0xffffff,
  emissiveIntensity: 0.85, roughness: 0.25, metalness: 0.0
});
const readerScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.104, 0.062), screenMat);
readerScreen.name = 'reader_screen_glass';
readerScreen.position.set(0, 0.052, 0.0048); reader.add(readerScreen);

const ringMat = new THREE.MeshStandardMaterial({ name:'rfid_ring', color:0x565250, roughness:0.5, emissive:0x000000 });
const ring = new THREE.Mesh(new THREE.TorusGeometry(0.030, 0.0022, 12, 64), ringMat);
ring.name = 'rfid_ring'; ring.position.set(0, -0.030, 0.004); reader.add(ring);
const ringInner = new THREE.Mesh(new THREE.TorusGeometry(0.019, 0.0018, 12, 48), ringMat);
ringInner.name = 'rfid_ring_inner'; ringInner.position.set(0, -0.030, 0.004); reader.add(ringInner);
const ringDot = new THREE.Mesh(new THREE.CircleGeometry(0.005, 32), ringMat);
ringDot.name = 'rfid_dot'; ringDot.position.set(0, -0.030, 0.0042); reader.add(ringDot);

const led = new THREE.Mesh(new THREE.BoxGeometry(0.060, 0.005, 0.002), MAT.led);
led.name = 'status_led'; led.position.set(0, -0.078, 0.0045); reader.add(led);

// ---- phone on a stand ----
const phoneRig = new THREE.Group(); phoneRig.name = 'phone_rig';
phoneRig.position.set(0.155, 0.022, 0.035);
scene.add(phoneRig);

const standBase = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.010, 0.075), MAT.stand);
standBase.name = 'stand_base'; standBase.position.y = 0.005; phoneRig.add(standBase);
const standBack = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.085, 0.010), MAT.stand);
standBack.name = 'stand_back';
standBack.position.set(0, 0.048, -0.026); standBack.rotation.x = -0.28; phoneRig.add(standBack);

const phone = new THREE.Group(); phone.name = 'phone';
phone.position.set(0, 0.088, -0.010); phone.rotation.x = -0.28;
phoneRig.add(phone);

const phoneBody = plate(0.074, 0.152, 0.010, 0.008, MAT.phoneBody, 'phone_body', 0.0012);
phone.add(phoneBody);
const ps = screenCanvas(512, 1040);
const phoneScreenMat = new THREE.MeshStandardMaterial({
  name:'phone_screen', map: ps.tex, emissiveMap: ps.tex, emissive: 0xffffff,
  emissiveIntensity: 0.95, roughness: 0.2, metalness: 0.0
});
const phoneScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.067, 0.140), phoneScreenMat);
phoneScreen.name = 'phone_screen_glass';
phoneScreen.position.z = 0.0055; phone.add(phoneScreen);

// ---- badge ----
const { model: badge } = buildBadge(THREE);
const badgeRig = new THREE.Group(); badgeRig.name = 'badge_rig';
badge.position.set(0, -0.163, 0); // pivot at the top of the strap
badgeRig.add(badge);
badgeRig.position.set(-0.08, 0.365, 0.20);
scene.add(badgeRig);

scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
stage.setObject(scene);

// ---------- screen painting ----------
let markedAt = null;

function paintReader(state, now) {
  const { ctx, c, tex } = rs;
  ctx.fillStyle = state === 'ok' ? '#12351d' : '#151313';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = state === 'ok' ? '#5be08a' : '#ec3013';
  ctx.fillRect(0, 0, c.width, 10);
  ctx.textAlign = 'center';
  if (state === 'ok') {
    ctx.fillStyle = '#8df0ae';
    ctx.font = '700 44px Archivo, sans-serif';
    ctx.fillText('ENTRADA', c.width/2, 108);
    ctx.fillText('REGISTRADA', c.width/2, 156);
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 84px Archivo, sans-serif';
    ctx.fillText(markedAt ? hhmm(markedAt) : '--:--', c.width/2, 250);
  } else {
    ctx.fillStyle = '#f3f2f2';
    ctx.font = '700 40px Archivo, sans-serif';
    ctx.fillText('ACERQUE SU', c.width/2, 110);
    ctx.fillText('CREDENCIAL', c.width/2, 158);
    ctx.fillStyle = '#8b8785';
    ctx.font = '600 40px Archivo, sans-serif';
    ctx.fillText(hhmmss(now), c.width/2, 240);
  }
  tex.needsUpdate = true;
}

function paintPhone(state, now) {
  const { ctx, c, tex } = ps;
  ctx.fillStyle = '#100f0f'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#6d6a68';
  ctx.font = '600 24px Archivo, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('XPRINT ASISTENCIA', 40, 70);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f3f2f2';
  ctx.font = '700 132px Archivo, sans-serif';
  ctx.fillText(hhmm(now), c.width/2, 250);
  ctx.fillStyle = '#8b8785';
  ctx.font = '600 30px Archivo, sans-serif';
  ctx.fillText(now.toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' }).toUpperCase(), c.width/2, 300);

  ctx.strokeStyle = '#2a2827'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(40, 360); ctx.lineTo(c.width - 40, 360); ctx.stroke();

  if (state === 'ok') {
    ctx.fillStyle = '#ec3013'; ctx.fillRect(40, 410, c.width - 80, 250);
    ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff';
    ctx.font = '700 30px Archivo, sans-serif';
    ctx.fillText('ASISTENCIA REGISTRADA', 68, 470);
    ctx.font = '700 92px Archivo, sans-serif';
    ctx.fillText(markedAt ? hhmm(markedAt) : '--:--', 68, 570);
    ctx.font = '600 26px Archivo, sans-serif';
    ctx.fillText('ENTRADA · PUERTA 1', 68, 620);
    ctx.textAlign = 'center'; ctx.fillStyle = '#6d6a68';
    ctx.font = '600 26px Archivo, sans-serif';
    ctx.fillText('AYUDANTE / OPERADOR A', c.width/2, 730);
    ctx.fillText('EQUIPO DE INSTALACIÓN', c.width/2, 772);
  } else {
    ctx.textAlign = 'left'; ctx.fillStyle = '#8b8785';
    ctx.font = '600 28px Archivo, sans-serif';
    ctx.fillText('SIN MARCAR HOY', 68, 470);
    ctx.strokeStyle = '#2a2827'; ctx.strokeRect(40, 410, c.width - 80, 130);
    ctx.fillStyle = '#4a4746';
    ctx.font = '600 24px Archivo, sans-serif';
    ctx.fillText('Acerque la credencial al lector', 68, 512);
  }
  tex.needsUpdate = true;
}

// ---------- animation ----------
const hudClock = document.getElementById('hud-clock');
const hudState = document.getElementById('hud-state');
const hudIn = document.getElementById('hud-in');
const CYCLE = 8.0, T_TAP = 2.0, T_HOLD_END = 4.6, T_BACK = 6.0;
const ease = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
const START_Z = 0.19, TAP_Z = 0.062;
let last = 'idle', lastPaint = -1;

function frame(ms) {
  const t = (ms / 1000) % CYCLE;
  const now = new Date();

  let z = START_Z, tilt = 0, state = 'idle';
  if (t < T_TAP) {
    const k = ease(t / T_TAP);
    z = START_Z + (TAP_Z - START_Z) * k;
    tilt = -0.20 * k;
  } else if (t < T_HOLD_END) {
    z = TAP_Z; tilt = -0.20; state = 'ok';
  } else if (t < T_BACK) {
    const k = ease((t - T_HOLD_END) / (T_BACK - T_HOLD_END));
    z = TAP_Z + (START_Z - TAP_Z) * k;
    tilt = -0.20 * (1 - k);
    state = 'ok';
  }

  if (state === 'ok' && last !== 'ok') markedAt = new Date();
  if (state !== last) { paintReader(state, now); paintPhone(state, now); last = state; }

  const sway = Math.sin(ms / 900) * 0.02 * (t < T_TAP || t > T_BACK ? 1 : 0.25);
  badgeRig.position.set(-0.08 + Math.sin(ms / 1400) * 0.004, 0.365, z);
  badgeRig.rotation.set(tilt, sway, Math.sin(ms / 1100) * 0.015);

  const lit = state === 'ok';
  MAT.led.color.setHex(lit ? 0x3ddc7a : 0x4a2018);
  MAT.led.emissive.setHex(lit ? 0x2fbf68 : 0x6b1b0c);
  MAT.led.emissiveIntensity = lit ? 1.4 : 0.35;
  ringMat.emissive.setHex(lit ? 0x1e6b3c : 0x000000);
  ringMat.emissiveIntensity = lit ? 0.9 : 0;

  const sec = Math.floor(ms / 250);
  if (sec !== lastPaint) {
    lastPaint = sec;
    if (state !== 'ok') { paintReader(state, now); paintPhone(state, now); }
    hudClock.textContent = hhmmss(now);
    hudState.textContent = lit ? 'Entrada registrada' : 'En espera';
    hudState.style.color = lit ? 'var(--color-accent-700)' : 'var(--color-text)';
    hudIn.textContent = markedAt ? hhmm(markedAt) + ' · Puerta 1' : '—';
  }
}
phoneScreen.onBeforeRender = () => { try { frame(performance.now()); } catch (e) { console.error(e); } };
paintReader('idle', new Date());
paintPhone('idle', new Date());
document.fonts.ready.then(() => { paintReader(last, new Date()); paintPhone(last, new Date()); });
requestAnimationFrame(function tick(ms){ try { frame(ms); } catch (e) { console.error(e); } requestAnimationFrame(tick); });
</script>
</body>
</html>
