name: Deploy theme to Shopify (draft)

on:
  workflow_dispatch: {}

jobs:
  push-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli

      - name: Push theme as draft
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
        run: |
          shopify theme push --theme=147850330165 \
            --store=hs0gwb-u1.myshopify.com \
            --path=. --no-color
