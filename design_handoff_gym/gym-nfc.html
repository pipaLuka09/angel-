<link rel="stylesheet" href="_ds/modernist-4e39d72f-67e8-4c3c-a4f8-011aa3009942/styles.css">

    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"

<style>
  html,body{margin:0;height:100%;background:var(--color-bg);font-family:var(--font-body)}
  three-d-stage:not(:defined){visibility:hidden}
  #hud{position:fixed;left:0;top:0;z-index:10;padding:20px 24px;pointer-events:none;max-width:340px}
  #hud .kicker{font-family:var(--font-heading);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 6px}
  #hud h1{font-family:var(--font-heading);font-size:22px;line-height:1.1;margin:0 0 12px;color:var(--color-text)}
  #hud .rule{height:2px;background:var(--color-divider);margin:0 0 12px}
  #hud dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px;color:var(--color-text)}
  #hud dt{font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.08em;font-size:11px;opacity:.6}
  #hud dd{margin:0;font-variant-numeric:tabular-nums}
  #hud .state{font-family:var(--font-heading);font-weight:700}
</style>

<body>
<div id="hud">
  <p class="kicker">Chip NFC · Estación 07</p>
  <h1>Prensa de pierna</h1>
  <div class="rule"></div>
  <dl>
    <dt>Paso</dt><dd class="state" id="hud-state">En espera</dd>
    <dt>Rutina</dt><dd id="hud-routine">—</dd>
    <dt>Video</dt><dd id="hud-video">—</dd>
  </dl>
</div>
<three-d-stage name="gym-nfc" background="#f3f2f2"></three-d-stage>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

const B = { lime:'#c8f04a', ink:'#141414', mid:'#2a2a2a', dim:'#8a8a8a', pink:'#fe2c55', insta:'#e1306c' };
const two = n => String(n).padStart(2, '0');
const hhmm = d => two(d.getHours()) + ':' + two(d.getMinutes());

function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w/2, y = -h/2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function plate(w, h, r, d, mat, name, bevel) {
  const g = new THREE.ExtrudeGeometry(roundedRect(w, h, r), bevel
    ? { depth:d, bevelEnabled:true, bevelThickness:bevel, bevelSize:bevel, bevelSegments:4, curveSegments:24 }
    : { depth:d, bevelEnabled:false, curveSegments:24 });
  g.center();
  const m = new THREE.Mesh(g, mat); m.name = name; return m;
}
function screenCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  return { c, ctx: c.getContext('2d'), tex };
}
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

const MAT = {
  steel: new THREE.MeshStandardMaterial({ name:'machine_steel', color:0x3a3a3c, roughness:0.42, metalness:0.55 }),
  chrome: new THREE.MeshStandardMaterial({ name:'machine_chrome', color:0xb9bcc0, roughness:0.18, metalness:0.85 }),
  pad: new THREE.MeshStandardMaterial({ name:'machine_pad', color:0x1b1b1c, roughness:0.72, metalness:0.05 }),
  plate: new THREE.MeshStandardMaterial({ name:'weight_plate', color:0x2a2a2c, roughness:0.55, metalness:0.30 }),
  floor: new THREE.MeshStandardMaterial({ name:'rubber_floor', color:0x2f2f30, roughness:0.92, metalness:0.02 }),
  accent: new THREE.MeshStandardMaterial({ name:'accent_red', color:0xec3013, roughness:0.40, metalness:0.05 }),
  tagBody: new THREE.MeshStandardMaterial({ name:'nfc_tag_body', color:0xf4f3f1, roughness:0.40, metalness:0.05 }),
  phoneBody: new THREE.MeshStandardMaterial({ name:'phone_body', color:0x1c1b1a, roughness:0.40, metalness:0.30 }),
  glass: new THREE.MeshStandardMaterial({ name:'phone_back_glass', color:0x24221f, roughness:0.25, metalness:0.40 }),
  pulse: new THREE.MeshStandardMaterial({ name:'nfc_pulse', color:0xc8f04a, emissive:0xc8f04a, emissiveIntensity:1.2, transparent:true, opacity:0.0, roughness:0.3 }),
};

const scene = new THREE.Group();
scene.name = 'gym_nfc_scene';

// ---- rubber floor slab ----
const floor = new THREE.Mesh(new THREE.BoxGeometry(0.60, 0.016, 0.42), MAT.floor);
floor.name = 'rubber_floor'; floor.position.set(0, 0.008, 0.02); scene.add(floor);
const floorEdge = new THREE.Mesh(new THREE.BoxGeometry(0.60, 0.004, 0.001), MAT.accent);
floorEdge.name = 'floor_edge'; floorEdge.position.set(0, 0.016, 0.2305); scene.add(floorEdge);

// ---- machine frame (leg press abstraction) ----
const machine = new THREE.Group(); machine.name = 'machine';
machine.position.set(-0.075, 0, -0.045); scene.add(machine);

// base rails
for (const x of [-0.055, 0.055]) {
  const rail = new THREE.Mesh(new THREE.BoxGeometry(0.026, 0.020, 0.230), MAT.steel);
  rail.name = 'base_rail_' + (x < 0 ? 'l' : 'r');
  rail.position.set(x, 0.026, 0.0); machine.add(rail);
}
const crossBar = new THREE.Mesh(new THREE.BoxGeometry(0.136, 0.018, 0.026), MAT.steel);
crossBar.name = 'base_cross'; crossBar.position.set(0, 0.026, -0.098); machine.add(crossBar);

// upright column with the NFC plate on it
const column = new THREE.Mesh(new THREE.BoxGeometry(0.038, 0.240, 0.038), MAT.steel);
column.name = 'upright_column'; column.position.set(0, 0.156, -0.086); machine.add(column);
const columnCap = new THREE.Mesh(new THREE.BoxGeometry(0.046, 0.010, 0.046), MAT.chrome);
columnCap.name = 'column_cap'; columnCap.position.set(0, 0.281, -0.086); machine.add(columnCap);

// diagonal sled arm
const arm = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.190, 0.022), MAT.chrome);
arm.name = 'sled_arm'; arm.position.set(0, 0.140, 0.010); arm.rotation.x = 0.62; machine.add(arm);
// foot platform
const platform = new THREE.Mesh(new THREE.BoxGeometry(0.120, 0.010, 0.078), MAT.steel);
platform.name = 'foot_platform';
platform.position.set(0, 0.210, -0.028); platform.rotation.x = 0.62; machine.add(platform);
// seat pad + back pad
const seat = new THREE.Mesh(new THREE.BoxGeometry(0.104, 0.020, 0.086), MAT.pad);
seat.name = 'seat_pad'; seat.position.set(0, 0.086, 0.062); machine.add(seat);
const backPad = new THREE.Mesh(new THREE.BoxGeometry(0.104, 0.088, 0.020), MAT.pad);
backPad.name = 'back_pad';
backPad.position.set(0, 0.130, 0.104); backPad.rotation.x = 0.22; machine.add(backPad);
// handles
for (const x of [-0.062, 0.062]) {
  const h = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.007, 0.070, 16), MAT.chrome);
  h.name = 'handle_' + (x < 0 ? 'l' : 'r');
  h.position.set(x, 0.128, 0.070); h.rotation.z = Math.PI/2; machine.add(h);
}
// weight stack
for (let i = 0; i < 5; i++) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.086, 0.014, 0.052), MAT.plate);
  p.name = 'weight_plate_' + (i+1);
  p.position.set(0, 0.048 + i * 0.017, -0.150); machine.add(p);
}
const stackRod = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.150, 12), MAT.chrome);
stackRod.name = 'stack_rod'; stackRod.position.set(0, 0.110, -0.150); machine.add(stackRod);

// ---- signage post carrying the NFC tag (outboard of the frame, facing the user) ----
const signPost = new THREE.Mesh(new THREE.BoxGeometry(0.026, 0.200, 0.026), MAT.steel);
signPost.name = 'sign_post'; signPost.position.set(-0.195, 0.100, 0.020); scene.add(signPost);
const signFoot = new THREE.Mesh(new THREE.BoxGeometry(0.070, 0.012, 0.070), MAT.steel);
signFoot.name = 'sign_post_foot'; signFoot.position.set(-0.195, 0.022, 0.020); scene.add(signFoot);
const signBracket = new THREE.Mesh(new THREE.BoxGeometry(0.062, 0.014, 0.014), MAT.chrome);
signBracket.name = 'sign_bracket'; signBracket.position.set(-0.162, 0.070, 0.020); scene.add(signBracket);

const tagRig = new THREE.Group(); tagRig.name = 'nfc_tag_rig';
tagRig.position.set(-0.195, 0.176, 0.0355);
scene.add(tagRig);

const TW = 0.072, TH = 0.072, TT = 0.0024;
tagRig.add(plate(TW, TH, 0.006, TT, MAT.tagBody, 'nfc_tag_body', 0.0005));
const ts = screenCanvas(420, 420);
const tagFaceMat = new THREE.MeshStandardMaterial({ name:'nfc_tag_print', map: ts.tex, roughness:0.35, metalness:0.03 });
const tagFace = new THREE.Mesh(new THREE.PlaneGeometry(TW - 0.001, TH - 0.001), tagFaceMat);
tagFace.name = 'nfc_tag_face'; tagFace.position.z = TT/2 + 0.0005; tagRig.add(tagFace);

const pulse = new THREE.Mesh(new THREE.TorusGeometry(0.016, 0.0013, 10, 56), MAT.pulse);
pulse.name = 'nfc_pulse_ring'; pulse.position.z = TT/2 + 0.004; tagRig.add(pulse);

// ---- phone ----
const phoneRig = new THREE.Group(); phoneRig.name = 'phone_rig'; scene.add(phoneRig);
const phone = new THREE.Group(); phone.name = 'phone'; phoneRig.add(phone);
phone.add(plate(0.074, 0.152, 0.010, 0.0085, MAT.phoneBody, 'phone_body', 0.0012));
const phoneBack = new THREE.Mesh(new THREE.PlaneGeometry(0.066, 0.144), MAT.glass);
phoneBack.name = 'phone_back'; phoneBack.position.z = -0.0048; phoneBack.rotation.y = Math.PI; phone.add(phoneBack);
const camBump = plate(0.024, 0.024, 0.004, 0.002, MAT.glass, 'camera_bump', 0.0006);
camBump.position.set(-0.020, 0.055, -0.0055); phone.add(camBump);

const ps = screenCanvas(560, 1150);
const phoneScreenMat = new THREE.MeshStandardMaterial({
  name:'phone_screen', map: ps.tex, emissiveMap: ps.tex, emissive: 0xffffff,
  emissiveIntensity: 0.95, roughness: 0.2, metalness: 0.0
});
const phoneScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.067, 0.142), phoneScreenMat);
phoneScreen.name = 'phone_screen_glass'; phoneScreen.position.z = 0.0055; phone.add(phoneScreen);

scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
stage.setObject(scene);

// tighter framing than the stage's default: frame the product-and-phone pair
{
  const cam = stage._camera, ctl = stage._controls;
  const center = new THREE.Vector3(-0.062, 0.185, 0.096);
  const dist = (0.165 / Math.tan((cam.fov * Math.PI) / 360)) * 1.06;
  const dir = new THREE.Vector3(1, 0.55, 1.25).normalize();
  cam.position.copy(center).add(dir.multiplyScalar(dist));
  cam.near = Math.max(dist / 100, 0.005);
  cam.far = dist * 100;
  cam.updateProjectionMatrix();
  ctl.target.copy(center);
  ctl.update();
}

// ---------- NFC tag artwork ----------
function nfcWaves(ctx, cx, cy, r0, n, lw, color) {
  ctx.strokeStyle = color; ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    ctx.lineWidth = lw - i * (lw * 0.18);
    ctx.beginPath(); ctx.arc(cx, cy, r0 + i * r0 * 0.62, -0.85, 0.85); ctx.stroke();
  }
}
function paintTag() {
  const { ctx, c, tex } = ts;
  ctx.fillStyle = B.ink; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = B.lime; ctx.fillRect(0, 0, c.width, 12);
  ctx.textAlign = 'left'; ctx.fillStyle = B.lime;
  ctx.font = '800 96px Archivo, sans-serif';
  ctx.fillText('07', 34, 108);
  ctx.textAlign = 'right'; ctx.fillStyle = '#ffffff';
  ctx.font = '800 40px Archivo, sans-serif';
  ctx.fillText('PRENSA', c.width - 30, 64);
  ctx.fillText('DE PIERNA', c.width - 30, 108);
  nfcWaves(ctx, 150, 250, 34, 4, 22, B.lime);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 15;
  rr(ctx, 232, 178, 112, 168, 18); ctx.stroke();
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff';
  ctx.font = '800 46px Archivo, sans-serif';
  ctx.fillText('ACERCA TU', c.width/2, 372);
  ctx.fillText('CELULAR', c.width/2, 402);
  tex.needsUpdate = true;
}

// ---------- phone screens ----------
const SETS = [['1', '12 reps', '40 kg'], ['2', '10 reps', '50 kg'], ['3', '8 reps', '60 kg']];

function statusBar(ctx, c, now, right, color) {
  ctx.fillStyle = color || B.dim; ctx.font = '600 22px Archivo, sans-serif';
  ctx.textAlign = 'left'; ctx.fillText(hhmm(now), 28, 40);
  ctx.textAlign = 'right'; ctx.fillText(right, c.width - 28, 40);
}
function playIcon(ctx, cx, cy, r) {
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(cx - r*0.28, cy - r*0.40); ctx.lineTo(cx + r*0.44, cy);
  ctx.lineTo(cx - r*0.28, cy + r*0.40); ctx.closePath(); ctx.fill();
}
function heartIcon(ctx, cx, cy, s, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx, cy + s * 0.72);
  ctx.bezierCurveTo(cx - s*1.35, cy - s*0.18, cx - s*0.62, cy - s*1.10, cx, cy - s*0.42);
  ctx.bezierCurveTo(cx + s*0.62, cy - s*1.10, cx + s*1.35, cy - s*0.18, cx, cy + s*0.72);
  ctx.closePath(); ctx.fill();
}

function bubbleIcon(ctx, cx, cy, s, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineJoin = 'round';
  rr(ctx, cx - s, cy - s * 0.82, s * 2, s * 1.42, s * 0.34); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.34, cy + s * 0.60); ctx.lineTo(cx - s * 0.52, cy + s * 1.06);
  ctx.lineTo(cx + s * 0.06, cy + s * 0.60); ctx.stroke();
}
function shareIcon(ctx, cx, cy, s, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.92, cy + s * 0.62); ctx.lineTo(cx + s * 0.92, cy - s * 0.30);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + s * 0.24, cy - s * 0.86); ctx.lineTo(cx + s * 0.92, cy - s * 0.30);
  ctx.lineTo(cx + s * 0.34, cy + s * 0.26); ctx.stroke();
}

function paintPhone(state, now, k) {
  const { ctx, c, tex } = ps;

  if (state === 'nfc') {
    ctx.fillStyle = '#0d0f14'; ctx.fillRect(0, 0, c.width, c.height);
    statusBar(ctx, c, now, 'NFC');
    ctx.textAlign = 'center';
    ctx.strokeStyle = B.lime; ctx.lineWidth = 8;
    for (let i = 0; i < 3; i++) {
      const r = 70 + i * 46 + Math.sin(k * Math.PI * 3) * 12;
      ctx.globalAlpha = 0.9 - i * 0.25;
      ctx.beginPath(); ctx.arc(c.width/2, 470, r, 0, Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffffff'; ctx.font = '800 34px Archivo, sans-serif';
    ctx.fillText('NFC', c.width/2, 484);
    ctx.font = '700 28px Archivo, sans-serif';
    ctx.fillText('Leyendo la máquina…', c.width/2, 700);
    ctx.fillStyle = B.dim; ctx.font = '600 24px Archivo, sans-serif';
    ctx.fillText('ESTACIÓN 07', c.width/2, 744);
    ctx.strokeStyle = '#2a2827'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(120, 820); ctx.lineTo(c.width - 120, 820); ctx.stroke();
    ctx.strokeStyle = B.lime;
    ctx.beginPath(); ctx.moveTo(120, 820); ctx.lineTo(120 + (c.width - 240) * Math.min(1, k), 820); ctx.stroke();

  } else if (state === 'exercise') {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = B.ink; ctx.fillRect(0, 0, c.width, 230);
    statusBar(ctx, c, now, 'ESTACIÓN 07', '#8a8a8a');
    ctx.textAlign = 'left';
    ctx.fillStyle = B.lime; ctx.font = '800 22px Archivo, sans-serif';
    ctx.fillText('EJERCICIO 07 · PIERNA', 28, 96);
    ctx.fillStyle = '#ffffff'; ctx.font = '800 44px Archivo, sans-serif';
    ctx.fillText('Prensa de', 28, 152);
    ctx.fillText('pierna', 28, 200);

    ctx.fillStyle = B.ink; ctx.font = '800 24px Archivo, sans-serif';
    ctx.fillText('TU SERIE DE HOY', 28, 296);
    let y = 350;
    const shown = Math.min(SETS.length, Math.max(1, Math.ceil(k * SETS.length * 1.5)));
    for (let i = 0; i < shown; i++) {
      const [n, reps, kg] = SETS[i];
      ctx.fillStyle = B.lime; ctx.fillRect(28, y - 30, 46, 46);
      ctx.fillStyle = B.ink; ctx.font = '800 26px Archivo, sans-serif';
      ctx.textAlign = 'center'; ctx.fillText(n, 51, y + 3);
      ctx.textAlign = 'left'; ctx.font = '800 30px Archivo, sans-serif';
      ctx.fillText(reps, 98, y + 4);
      ctx.textAlign = 'right'; ctx.fillStyle = '#5a5a5a';
      ctx.fillText(kg, c.width - 28, y + 4);
      ctx.textAlign = 'left';
      ctx.strokeStyle = '#e6e6e6'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(28, y + 38); ctx.lineTo(c.width - 28, y + 38); ctx.stroke();
      y += 100;
    }
    ctx.fillStyle = '#5a5a5a'; ctx.font = '600 23px Archivo, sans-serif';
    ctx.fillText('Descanso 90 s · Espalda pegada al respaldo', 28, y + 34);

    // video CTA
    ctx.fillStyle = B.pink; ctx.fillRect(28, 880, c.width - 56, 96);
    playIcon(ctx, 82, 928, 26);
    ctx.fillStyle = '#ffffff'; ctx.font = '800 27px Archivo, sans-serif';
    ctx.fillText('VER CÓMO SE HACE', 126, 938);
    ctx.fillStyle = '#8a8a8a'; ctx.font = '600 22px Archivo, sans-serif';
    ctx.fillText('Abierto por NFC desde la máquina', 28, 1030);

  } else if (state === 'video') {
    // vertical short-video player
    ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, c.width, c.height);
    const g = ctx.createLinearGradient(0, 0, c.width, c.height);
    g.addColorStop(0, '#1d2126'); g.addColorStop(0.55, '#2c3238'); g.addColorStop(1, '#14171a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
    // gym-room suggestion: floor line + machine silhouette block
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 760, c.width, c.height - 760);
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.moveTo(120, 760); ctx.lineTo(210, 430); ctx.lineTo(330, 430);
    ctx.lineTo(420, 760); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fillRect(150, 560, 260, 26);

    statusBar(ctx, c, now, 'REELS', 'rgba(255,255,255,0.75)');

    if (k < 0.22) playIcon(ctx, c.width/2, 560, 54);

    // right-side action rail
    const railX = c.width - 62;
    heartIcon(ctx, railX, 640, 26, k > 0.55 ? B.pink : '#ffffff');
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff';
    ctx.font = '700 20px Archivo, sans-serif';
    ctx.fillText(k > 0.55 ? '4.3 k' : '4.2 k', railX, 692);
    bubbleIcon(ctx, railX, 742, 24, '#ffffff');
    ctx.font = '700 20px Archivo, sans-serif'; ctx.fillStyle = '#ffffff';
    ctx.fillText('218', railX, 792);
    shareIcon(ctx, railX, 848, 24, '#ffffff');

    // caption block
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff'; ctx.font = '800 26px Archivo, sans-serif';
    ctx.fillText('@coach.rivas', 28, 900);
    ctx.font = '600 23px Archivo, sans-serif';
    ctx.fillText('Prensa de pierna — pies a la altura', 28, 940);
    ctx.fillText('de los hombros, no bloquees rodilla', 28, 972);
    ctx.fillStyle = B.lime; ctx.font = '700 22px Archivo, sans-serif';
    ctx.fillText('#tecnica  #pierna  #gym', 28, 1010);

    // progress bar
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(28, 1060); ctx.lineTo(c.width - 28, 1060); ctx.stroke();
    ctx.strokeStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(28, 1060);
    ctx.lineTo(28 + (c.width - 56) * Math.min(1, k), 1060); ctx.stroke();

  } else {
    ctx.fillStyle = '#0d0f14'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.textAlign = 'center'; ctx.fillStyle = '#f3f2f2';
    ctx.font = '700 132px Archivo, sans-serif'; ctx.fillText(hhmm(now), c.width/2, 300);
    ctx.fillStyle = B.dim; ctx.font = '600 26px Archivo, sans-serif';
    ctx.fillText(now.toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' }).toUpperCase(), c.width/2, 350);
    ctx.fillStyle = '#2a2827'; ctx.fillRect(40, 940, c.width - 80, 120);
    ctx.fillStyle = '#9aa0a6'; ctx.font = '600 24px Archivo, sans-serif';
    ctx.fillText('NFC activado', c.width/2, 1010);
  }
  tex.needsUpdate = true;
}

// ---------- animation ----------
const hudState = document.getElementById('hud-state');
const hudRoutine = document.getElementById('hud-routine');
const hudVideo = document.getElementById('hud-video');
const CYCLE = 16.0, T_IN = 2.2, T_NFC = 4.0, T_EX = 8.6, T_VID = 14.6, T_OUT = 15.4;
const ease = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
const FAR = new THREE.Vector3(0.130, 0.150, 0.215);
const TAP = new THREE.Vector3(-0.195, 0.176, 0.0475);
const READ = new THREE.Vector3(0.060, 0.185, 0.140);
let last = '';

function frame(ms) {
  const t = (ms / 1000) % CYCLE;
  const now = new Date();
  let p, rx, ry, state, k = 0;

  if (t < T_IN) {
    k = ease(t / T_IN);
    p = FAR.clone().lerp(TAP, k);
    rx = -0.50 + 0.50 * k; ry = 0.50 - 0.50 * k; state = 'idle';
  } else if (t < T_NFC) {
    k = (t - T_IN) / (T_NFC - T_IN);
    p = TAP.clone(); p.z += Math.sin(k * Math.PI) * 0.004;
    rx = 0.0; ry = 0.0; state = 'nfc';
  } else if (t < T_EX) {
    k = (t - T_NFC) / (T_EX - T_NFC);
    const e = ease(Math.min(1, k * 2.2));
    p = TAP.clone().lerp(READ, e);
    rx = -0.40 * e; ry = 0.16 * e; state = 'exercise';
  } else if (t < T_VID) {
    k = (t - T_EX) / (T_VID - T_EX);
    p = READ.clone(); p.y += Math.sin(k * Math.PI) * 0.005;
    rx = -0.40; ry = 0.16; state = 'video';
  } else if (t < T_OUT) {
    k = ease((t - T_VID) / (T_OUT - T_VID));
    p = READ.clone().lerp(FAR, k);
    rx = -0.40 - 0.15 * k; ry = 0.16 + 0.29 * k; state = 'video'; k = 1;
  } else {
    p = FAR.clone(); rx = -0.55; ry = 0.45; state = 'idle';
  }

  phoneRig.position.copy(p);
  phone.rotation.set(rx, ry, Math.sin(ms / 1300) * 0.02);
  paintPhone(state, now, k);

  const glow = state === 'nfc' ? 0.55 + 0.45 * Math.sin(k * Math.PI * 4) : 0;
  MAT.pulse.opacity = glow;
  pulse.scale.setScalar(1 + (state === 'nfc' ? k * 0.5 : 0));

  if (state !== last) {
    last = state;
    hudState.textContent = state === 'nfc' ? 'Conexión NFC' : state === 'exercise' ? 'Rutina en pantalla'
      : state === 'video' ? 'Video de técnica' : 'En espera';
    hudState.style.color = state === 'idle' ? 'var(--color-text)' : 'var(--color-accent-700)';
    hudRoutine.textContent = state === 'idle' || state === 'nfc' ? '—' : '3 series · 12/10/8';
    hudVideo.textContent = state === 'video' ? '@coach.rivas · Reels' : '—';
  }
}
paintTag();
paintPhone('idle', new Date(), 0);
document.fonts.ready.then(() => { paintTag(); });
phoneScreen.onBeforeRender = () => { try { frame(performance.now()); } catch (e) { console.error(e); } };
requestAnimationFrame(function tick(ms){ try { frame(ms); } catch (e) { console.error(e); } requestAnimationFrame(tick); });
</script>
</body>
