<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!--
  El toque: un celular se acerca al círculo del acrílico, salen las ondas NFC y
  se abre la pantalla (el pago, el Wi-Fi, la carta, la reseña o la máquina de
  FORJA). renderAt(t) dibuja el cuadro exacto del segundo t;
  ?k=pago|wifi|menu|resenas|acrilico|gym elige la escena y ?w=&h= el tamaño del cuadro
  (1080x1350 tienda, 720x1280 carrusel del inicio). La foto de fondo, dónde
  tocar, el color de las ondas, el tamaño del celular y el sticker que se pega
  (acrílico reutilizado) salen de acrilicos.json, que arma acrilicos.py.
-->
<style>
@font-face{font-family:A;src:url(../../sitio/fonts/archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:S;src:url(../../sitio/fonts/serif-italic.woff2) format('woff2');font-weight:500;font-style:italic}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden}
#view{position:relative;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:0 0}
#photo{position:absolute;inset:0;width:1080px;height:1350px}
#dim{position:absolute;inset:0;background:#05070c;opacity:0}
.ring{position:absolute;border-radius:50%;border:7px solid;opacity:0;pointer-events:none}

/* el celular */
#phone{position:absolute;left:0;top:0;width:330px;height:680px;transform-origin:50% 30%}
#shadow{position:absolute;left:0;top:0;width:330px;height:680px;border-radius:56px;background:#000;transform-origin:50% 30%}
.body{position:absolute;inset:0;border-radius:56px;
  background:linear-gradient(135deg,#5b5f68 0%,#2a2d33 18%,#141519 50%,#2b2e35 82%,#61656e 100%);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18)}
.btn{position:absolute;background:linear-gradient(90deg,#2c2f35,#55585f);border-radius:3px}
.bezel{position:absolute;inset:7px;border-radius:50px;background:#000}
.screen{position:absolute;inset:16px;border-radius:42px;overflow:hidden;background:#0b0d12;font-family:A,sans-serif}
.island{position:absolute;left:50%;top:13px;width:96px;height:28px;margin-left:-48px;border-radius:20px;background:#000;z-index:20}
.glass{position:absolute;inset:16px;border-radius:42px;pointer-events:none;z-index:30;
  background:linear-gradient(118deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.05) 34%,rgba(255,255,255,0) 35%,rgba(255,255,255,0) 100%)}
.sb{position:absolute;left:0;right:0;top:0;height:54px;display:flex;justify-content:space-between;align-items:center;
  padding:6px 30px 0 34px;font-weight:700;font-size:15px;z-index:10}
.sb .ic{display:flex;gap:6px;align-items:center}

.layer{position:absolute;inset:0}
/* bloqueo */
#lock{background:radial-gradient(120% 80% at 30% 20%,#2f4a8a 0%,#101a35 55%,#070b16 100%);color:#fff;text-align:center}
#lock .time{margin-top:92px;font-weight:300;font-stretch:90%;font-size:76px;letter-spacing:-2px}
#lock .date{font-size:16px;font-weight:500;opacity:.8}
#lock .nfc{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);font-size:13px;font-weight:600;opacity:.7;letter-spacing:.5px}

/* tarjetas que se abren */
.sheet{position:absolute;left:10px;right:10px;bottom:10px;border-radius:30px;background:#fff;color:#0A2463;padding:24px 22px 22px}
.cta{display:block;width:100%;border:0;border-radius:16px;padding:15px 0;font-family:A;font-weight:800;font-size:17px;text-align:center}
.tap{position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(10,36,99,.28);opacity:0;z-index:40}
.check{width:84px;height:84px;border-radius:50%;margin:0 auto;display:grid;place-items:center}
.check svg{width:44px;height:44px}
.muted{color:#6a7593}
</style></head>
<body>
<div id="view"><div id="stage">
  <img id="photo" alt="">
  <img id="stk" alt="" style="position:absolute;left:0;top:0;opacity:0">
  <div id="rings"></div>
  <div id="dim"></div>
  <div id="shadow"></div>
  <div id="phone">
    <div class="body"></div>
    <i class="btn" style="left:-3px;top:150px;width:4px;height:34px"></i>
    <i class="btn" style="left:-3px;top:200px;width:4px;height:60px"></i>
    <i class="btn" style="left:-3px;top:272px;width:4px;height:60px"></i>
    <i class="btn" style="right:-3px;top:220px;width:4px;height:92px"></i>
    <div class="bezel"></div>
    <div class="screen" id="screen">
      <div class="island"></div>
      <div class="sb" id="sb"><span>10:24</span><span class="ic" id="sbic"></span></div>
      <div class="layer" id="lock"><div class="time">10:24</div><div class="date">miércoles 15 de octubre</div><div class="nfc">NFC activado</div></div>
      <div class="layer" id="app"></div>
      <div class="tap" id="tapdot"></div>
    </div>
    <div class="glass"></div>
  </div>
</div></div>

<script>
const Q = new URLSearchParams(location.search);
const K = Q.get('k') || 'pago', VW = +(Q.get('w') || 1080), VH = +(Q.get('h') || 1350);
const INFO = window.__INFO;
const TAP = INFO[K].tap;               // x, y, radio del círculo en la foto (1080x1350)
const D = INFO[K].delay || 0;          // segundos antes de que entre el celular
window.__total = 7.5 + D;

// el cuadro: la foto 1080x1350 a lo alto del cuadro, centrada
const view = document.getElementById('view'), stage = document.getElementById('stage');
view.style.width = VW + 'px'; view.style.height = VH + 'px';
const SC = VH / 1350, OX = (VW - 1080 * SC) / 2;
stage.style.transform = `translate(${OX}px,0) scale(${SC})`;
document.getElementById('photo').src = INFO[K].photo;
if (INFO[K].sticker) document.getElementById('stk').src = INFO[K].sticker.src;

const NAVY = '#0A2463', YEL = '#FFD100', MINT = '#2BB58A';
const wifiIc = (c, full) => `<svg width="18" height="14" viewBox="0 0 18 14"><path d="M9 13.2 1 4.6a11.6 11.6 0 0 1 16 0z" fill="${c}" opacity="${full ? 1 : .35}"/></svg>`;
const sig = c => `<svg width="18" height="12" viewBox="0 0 18 12" fill="${c}"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>`;
const bat = c => `<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="${c}" opacity=".5"/><rect x="2.5" y="2.5" width="16" height="8" rx="2" fill="${c}"/><rect x="24.5" y="4.5" width="2" height="4" rx="1" fill="${c}" opacity=".5"/></svg>`;
const CHECK = c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;

// --- las pantallas de cada acrílico --------------------------------------
const dishes = L => L.map(([a, b]) => `<div style="padding:15px 0;border-top:1px solid rgba(243,234,223,.12)"><div style="font-weight:800;font-size:17px">${a}</div><div style="font-family:S;font-style:italic;font-size:15px;opacity:.7;margin-top:2px">${b}</div></div>`).join('');
const SCREENS = {
  wifi: {
    bg: 'radial-gradient(120% 80% at 30% 20%,#2f4a8a 0%,#101a35 55%,#070b16 100%)',
    ask: `<div class="sheet" id="s1">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
          <div style="width:46px;height:46px;border-radius:14px;background:#E3F4EE;display:grid;place-items:center">${wifiIc(NAVY, true).replace('width="18" height="14"', 'width="24" height="19"')}</div>
          <div><div style="font-weight:800;font-size:19px">Red Wi-Fi</div><div class="muted" style="font-size:13px;font-weight:500">Leída con NFC</div></div></div>
        <div style="font-family:S;font-style:italic;font-size:22px;line-height:1.15;margin-bottom:18px">¿Conectarse a la red<br><b style="font-family:A;font-style:normal;font-weight:800">Invitados</b>?</div>
        <div style="display:flex;gap:10px"><span class="cta" style="background:#EEF1F7;color:#0A2463;flex:1">Ahora no</span><span class="cta" id="go" style="background:#0A2463;color:#fff;flex:1.3">Conectar</span></div></div>`,
    done: `<div class="sheet" id="s2" style="text-align:center;padding-top:30px">
        <div class="check" style="background:#E3F4EE">${CHECK(MINT)}</div>
        <div style="font-weight:900;font-stretch:85%;font-size:28px;margin-top:14px">¡Conectado!</div>
        <div style="font-family:S;font-style:italic;font-size:19px;margin-top:4px">sin escribir la clave</div>
        <div style="margin:18px 0 4px;padding:13px 14px;border-radius:16px;background:#F3F6FA;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700">
          <span style="display:flex;gap:8px;align-items:center">${wifiIc(NAVY, true)} Invitados</span><span style="color:${MINT};font-size:12px;letter-spacing:.5px">EXCELENTE</span></div></div>`,
    button: [0.68, 0.905],      // dónde cae el dedo, en fracción de la pantalla
    bar: ['#fff', '#fff'],      // color de la barra de estado antes y después
  },
  pago: {
    bg: '#F4F5F9',
    ask: `<div class="layer" id="s1" style="background:#F4F5F9;color:#0A2463">
        <div style="height:210px;background:${YEL};border-radius:0 0 36px 36px;padding:70px 26px 0">
          <div style="font-weight:900;font-stretch:85%;font-size:26px">Pagar</div>
          <div style="font-weight:600;font-size:14px;opacity:.75">Leído con NFC</div></div>
        <div style="margin:-62px 16px 0;background:#fff;border-radius:26px;padding:22px 20px;box-shadow:0 10px 30px rgba(10,36,99,.08)">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:48px;height:48px;border-radius:50%;background:#0A2463;color:${YEL};display:grid;place-items:center;font-weight:900;font-size:20px">C</div>
            <div><div style="font-weight:800;font-size:17px">Consultorio dental</div><div class="muted" style="font-size:13px;font-weight:500">Machala</div></div></div>
          <div class="muted" style="font-size:13px;font-weight:600;margin-top:22px">Monto</div>
          <div style="font-weight:900;font-stretch:85%;font-size:46px;letter-spacing:-1px;line-height:1.05">$ 35,00</div>
          <div style="margin-top:16px;padding-top:14px;border-top:1px solid #EDF0F5;display:flex;justify-content:space-between;font-size:13px;font-weight:600"><span class="muted">Desde</span><span>Cuenta de ahorros ••• 4821</span></div></div>
        <span class="cta" id="go" style="position:absolute;left:16px;right:16px;bottom:30px;width:auto;background:#0A2463;color:#fff">Confirmar pago</span></div>`,
    done: `<div class="layer" id="s2" style="background:#0A2463;color:#fff;text-align:center;padding-top:150px">
        <div class="check" style="background:${YEL}">${CHECK(NAVY)}</div>
        <div style="font-weight:900;font-stretch:85%;font-size:32px;margin-top:20px">¡Pago exitoso!</div>
        <div style="font-family:S;font-style:italic;font-size:20px;margin-top:4px;opacity:.85">en segundos, sin efectivo</div>
        <div style="margin:30px 18px 0;padding:18px;border-radius:22px;background:rgba(255,255,255,.08);text-align:left;font-size:14px;font-weight:600">
          <div style="display:flex;justify-content:space-between"><span style="opacity:.7">Monto</span><span style="font-weight:800">$ 35,00</span></div>
          <div style="display:flex;justify-content:space-between;margin-top:10px"><span style="opacity:.7">Para</span><span>Consultorio dental</span></div>
          <div style="display:flex;justify-content:space-between;margin-top:10px"><span style="opacity:.7">Hora</span><span>10:24</span></div></div></div>`,
    button: [0.5, 0.925],
    bar: [NAVY, '#fff'],
  },
  menu: {
    bg: '#14110F',
    // el encabezado y las pestañas quedan quietos; solo cambia la lista
    ask: `<div class="layer" style="background:#14110F;color:#F3EADF;padding:66px 22px 0">
        <div style="font-family:S;font-style:italic;font-size:40px;line-height:1">Carta</div>
        <div style="font-size:13px;font-weight:600;opacity:.6;margin-top:4px">Leída con NFC · actualizada hoy</div>
        <div id="tabs" style="position:relative;display:flex;gap:6px;margin:20px 0 0;font-size:13px;font-weight:700;white-space:nowrap">
          <i id="pill" style="position:absolute;top:0;height:100%;border-radius:20px;background:#F3EADF"></i>
          <span class="tb" style="position:relative;padding:9px 12px;border-radius:20px;border:1px solid rgba(243,234,223,.3)">Entradas</span>
          <span class="tb" id="go" style="position:relative;padding:9px 12px;border-radius:20px;border:1px solid rgba(243,234,223,.3)">Platos fuertes</span>
          <span class="tb" style="position:relative;padding:9px 12px;border-radius:20px;border:1px solid rgba(243,234,223,.3)">Bebidas</span></div></div>
      <div class="layer" id="s1" style="top:200px;color:#F3EADF;padding:0 22px">${dishes([['Bolón de verde', 'Con queso o chicharrón, y huevo frito'], ['Ceviche de camarón', 'Con chifles, canguil y limón'], ['Empanadas de viento', 'Tres, con azúcar por encima'], ['Patacones con queso', 'Verde crocante y queso fresco']])}</div>`,
    done: `<div class="layer" id="s2" style="top:200px;color:#F3EADF;padding:0 22px">${dishes([['Encebollado', 'Albacora, yuca y cebolla curtida'], ['Seco de pollo', 'Con arroz amarillo y maduro'], ['Arroz con menestra', 'Carne asada y patacones'], ['Guatita', 'Con arroz, aguacate y maduro']])}</div>`,
    button: [0.47, 0.235],
    bar: ['#fff', '#fff'],
    slide: true,
  },
  resenas: {
    bg: '#fff',
    ask: `<div class="layer" id="s1" style="background:#fff;color:#1d1d1f;text-align:center;padding-top:96px">
        <div style="width:64px;height:64px;border-radius:50%;margin:0 auto;background:#3B2A20;color:#F3EADF;display:grid;place-items:center;font-family:S;font-style:italic;font-size:30px">C</div>
        <div style="font-weight:800;font-size:20px;margin-top:12px">Cafetería · Machala</div>
        <div class="muted" style="font-size:13px;font-weight:600;margin-top:2px">Reseña en Google Maps</div>
        <div style="font-family:S;font-style:italic;font-size:24px;margin-top:26px">¿Cómo estuvo tu visita?</div>
        <div id="stars" style="display:flex;justify-content:center;gap:8px;margin-top:16px"></div>
        <div style="margin:28px 22px 0;padding:16px;border-radius:16px;background:#F4F4F6;text-align:left;font-size:14px;color:#8a8a93">Cuenta cómo te fue (opcional)</div>
        <span class="cta" id="go" style="position:absolute;left:18px;right:18px;bottom:30px;width:auto;background:#1d1d1f;color:#fff">Publicar</span></div>`,
    done: `<div class="layer" id="s2" style="background:#fff;color:#1d1d1f;text-align:center;padding-top:170px">
        <div class="check" style="background:#2BB58A">${CHECK('#fff')}</div>
        <div style="font-weight:900;font-stretch:85%;font-size:30px;margin-top:20px">¡Gracias!</div>
        <div style="font-family:S;font-style:italic;font-size:20px;margin-top:4px">tu reseña ya se publicó</div>
        <div style="margin-top:22px;font-size:26px;letter-spacing:6px;color:#F2A900">★★★★★</div></div>`,
    button: [0.5, 0.925],
    bar: ['#1d1d1f', '#1d1d1f'],
  },
  gym: {
    bg: '#0E0F12',
    ask: `<div class="layer" id="s1" style="background:#0E0F12;color:#fff;padding:64px 20px 0">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;letter-spacing:1.5px"><span style="color:#EC3013">FORJA</span><span style="opacity:.55">ESTACIÓN 07</span></div>
        <div style="font-family:S;font-style:italic;font-size:34px;line-height:1.05;margin-top:12px">Press de banca</div>
        <div style="margin-top:14px;padding:12px 14px;border-radius:14px;background:#1A1C21;font-size:13px;font-weight:600"><span style="opacity:.55">Tu última vez · hace 3 días</span><br><b style="font-size:16px">60 kg × 10 repeticiones</b></div>
        <div style="font-size:12px;font-weight:700;letter-spacing:1px;opacity:.55;margin-top:22px">PESO</div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">
          <span style="width:52px;height:52px;border-radius:16px;background:#1A1C21;display:grid;place-items:center;font-size:28px;font-weight:700">−</span>
          <span style="font-weight:900;font-stretch:85%;font-size:44px">62,5 <small style="font-size:18px;opacity:.6">kg</small></span>
          <span style="width:52px;height:52px;border-radius:16px;background:#EC3013;display:grid;place-items:center;font-size:28px;font-weight:700">+</span></div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:15px;font-weight:700"><span style="opacity:.55">Repeticiones</span><span style="font-size:22px">10</span></div>
        <div style="display:flex;gap:8px;margin-top:18px;font-size:13px;font-weight:700">
          <span style="flex:1;text-align:center;padding:10px 0;border-radius:12px;background:#1A1C21">Fácil</span>
          <span style="flex:1;text-align:center;padding:10px 0;border-radius:12px;background:#fff;color:#0E0F12">Bien</span>
          <span style="flex:1;text-align:center;padding:10px 0;border-radius:12px;background:#1A1C21">Duro</span></div>
        <span class="cta" id="go" style="position:absolute;left:18px;right:18px;bottom:30px;width:auto;background:#EC3013;color:#fff">Guardar serie</span></div>`,
    done: `<div class="layer" id="s2" style="background:#0E0F12;color:#fff;text-align:center;padding-top:150px">
        <div class="check" style="background:#EC3013">${CHECK('#fff')}</div>
        <div style="font-weight:900;font-stretch:85%;font-size:30px;margin-top:20px">¡Serie guardada!</div>
        <div style="font-family:S;font-style:italic;font-size:20px;margin-top:4px;opacity:.85">62,5 kg × 10, en la estación 07</div>
        <div style="margin:28px 20px 0;padding:16px;border-radius:18px;background:#1A1C21;text-align:left;font-size:14px;font-weight:600">
          <div style="display:flex;justify-content:space-between"><span style="opacity:.6">Nuevo récord</span><span style="color:#EC3013;font-weight:800">+2,5 kg</span></div>
          <div style="display:flex;justify-content:space-between;margin-top:10px"><span style="opacity:.6">Sesiones en esta máquina</span><span>14</span></div></div></div>`,
    button: [0.5, 0.925],
    bar: ['#fff', '#fff'],
  },
};
// el acrílico reutilizado era de menú con QR: con el sticker abre la misma carta
SCREENS.acrilico = SCREENS.menu;
const APP = SCREENS[K];
const app = document.getElementById('app');
app.style.background = APP.bg;
app.innerHTML = APP.ask + APP.done;
const s1 = document.getElementById('s1'), s2 = document.getElementById('s2'), go = document.getElementById('go');
const STARS = document.getElementById('stars');
const star = on => `<svg width="44" height="44" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z" fill="${on ? '#F2A900' : 'none'}" stroke="${on ? '#F2A900' : '#c9c9cf'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;

// anillos NFC alrededor del círculo
const rings = document.getElementById('rings');
const RING_COL = INFO[K].ring || (K === 'pago' ? '255,209,0' : '255,106,85');
const R = [];
for (let i = 0; i < 3; i++) { const d = document.createElement('div'); d.className = 'ring'; rings.appendChild(d); R.push(d); }

// --- tiempo --------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const mix = (A, B, x) => A.map((v, i) => lerp(v, B[i], x));

const PW = 330, PH = 680, AX = .5, AY = .3;       // el punto del celular que toca: arriba al centro (la antena)
// poses: [x, y, rotación, escala] del punto de anclaje en la foto
const PS = INFO[K].phone || 1;                      // el celular a la escala de la escena (lejos en el gimnasio)
const P_OUT = [TAP[0] + 560, TAP[1] + 1250, -26, 1.12 * PS];
const P_NEAR = [TAP[0] + 40 * PS, TAP[1] + 70 * PS, -12, 1.06 * PS];
const P_TAP = [TAP[0] + 8 * PS, TAP[1] + 16 * PS, -9, PS];
const P_SHOW = [540, 470, 0, 1.24];

function pose(t) {
  if (t < .5) return P_OUT;
  if (t < 1.7) return mix(P_OUT, P_NEAR, eio(seg(t, .5, 1.7)));
  if (t < 2.05) return mix(P_NEAR, P_TAP, eout(seg(t, 1.7, 2.05)));
  if (t < 2.75) return P_TAP;
  if (t < 3.55) return mix(P_TAP, P_SHOW, eio(seg(t, 2.75, 3.55)));
  if (t < 6.55) return P_SHOW;
  return mix(P_SHOW, [P_SHOW[0] + 40, P_SHOW[1] + 1150, 8, 1.2], eio(seg(t, 6.55, 7.35)));
}

window.renderAt = function (T) {
  // acrílico reutilizado: primero se pega el sticker en el acrílico de siempre
  const S = INFO[K].sticker;
  if (S) {
    const stk = document.getElementById('stk'), k = seg(T, .3, .95), land = eout(k);
    const sc = lerp(1.7, 1, land) * (1 - .06 * Math.sin(Math.PI * seg(T, .95, 1.2)));
    const d = S.d * sc;
    stk.style.width = stk.style.height = d + 'px';
    stk.style.transform = `translate(${TAP[0] - d / 2 + (1 - land) * 160}px,${TAP[1] - d / 2 - (1 - land) * 220}px) rotate(${(1 - land) * -40}deg)`;
    stk.style.opacity = clamp(k * 3);
    stk.style.filter = `drop-shadow(${3 + (1 - land) * 30}px ${4 + (1 - land) * 40}px ${4 + (1 - land) * 18}px rgba(0,0,0,${.45 - (1 - land) * .2}))`;
  }
  const t = T - D;
  // celular
  let [x, y, r, s] = pose(t);
  // vibra un poco al leer el chip
  if (t > 2.05 && t < 2.35) { const v = Math.sin((t - 2.05) * 90) * (1 - seg(t, 2.05, 2.35)) * 3; x += v; }
  const ph = document.getElementById('phone'), sh = document.getElementById('shadow');
  const tf = `translate(${x - PW * AX}px,${y - PH * AY}px) rotate(${r}deg) scale(${s})`;
  ph.style.transform = tf;
  // sombra sobre el acrílico: pegada cuando toca, más lejana y suave cuando el celular está cerca de la cámara
  const near = t < 2.05 ? 1 - seg(t, .5, 2.05) * .85 : t < 2.75 ? .15 : clamp(.15 + seg(t, 2.75, 3.55) * .85);
  const off = 10 + near * 50, blur = 10 + near * 34, op = .55 - near * .25;
  sh.style.transform = tf + ` translate(${off * .6}px,${off}px)`;
  sh.style.filter = `blur(${blur}px)`; sh.style.opacity = t < .5 || t > 7.3 ? 0 : op;

  // la foto se oscurece para que la pantalla mande
  document.getElementById('dim').style.opacity = .55 * eio(seg(t, 2.75, 3.55)) * (1 - eio(seg(t, 6.55, 7.2)));

  // ondas NFC
  R.forEach((d, i) => {
    const k = seg(t, 1.95 + i * .2, 2.85 + i * .2);
    const rr = TAP[2] * (1.05 + eout(k) * 1.9);
    d.style.left = TAP[0] - rr + 'px'; d.style.top = TAP[1] - rr + 'px';
    d.style.width = d.style.height = 2 * rr + 'px';
    d.style.borderColor = `rgba(${RING_COL},1)`;
    d.style.opacity = k > 0 && k < 1 ? Math.pow(1 - k, 1.3) : 0;
  });

  // pantalla: bloqueo -> se abre la app -> el dedo confirma -> listo
  const open = eout(seg(t, 2.2, 2.6));
  const lock = document.getElementById('lock');
  lock.style.opacity = 1 - open;
  app.style.opacity = open;
  app.style.transform = `scale(${lerp(.92, 1, open)})`;
  const sb = document.getElementById('sb');
  const sbc = open > .5 ? APP.bar[t < 4.35 ? 0 : 1] : '#fff';  // la barra de estado sobre fondo claro u oscuro
  sb.style.color = sbc;
  const wifiOn = K === 'wifi' ? t > 4.35 : true;
  document.getElementById('sbic').innerHTML = sig(sbc) + wifiIc(sbc, wifiOn) + bat(sbc);

  const press = seg(t, 3.9, 4.15), done = eout(seg(t, 4.3, 4.7));
  go.style.transform = `scale(${1 - .05 * Math.sin(Math.PI * press)})`;
  const dot = document.getElementById('tapdot');
  dot.style.left = `calc(${APP.button[0] * 100}% - 28px)`; dot.style.top = `calc(${APP.button[1] * 100}% - 28px)`;
  dot.style.opacity = t > 3.75 && t < 4.35 ? Math.sin(Math.PI * seg(t, 3.75, 4.35)) * .9 : 0;
  dot.style.transform = `scale(${lerp(.6, 1.15, seg(t, 3.75, 4.35))})`;
  if (APP.slide) {  // la carta: la lista se desliza como al cambiar de pestaña
    s1.style.transform = `translateX(${-done * 110}%)`; s2.style.transform = `translateX(${(1 - done) * 110}%)`;
    const tb = [...document.querySelectorAll('.tb')], pill = document.getElementById('pill');
    const a = tb[0], b = tb[1];
    pill.style.left = lerp(a.offsetLeft, b.offsetLeft, done) + 'px';
    pill.style.width = lerp(a.offsetWidth, b.offsetWidth, done) + 'px';
    a.style.color = done < .5 ? '#14110F' : '#F3EADF'; b.style.color = done < .5 ? '#F3EADF' : '#14110F';
  } else {
    s1.style.opacity = 1 - done;
    s2.style.opacity = done;
    s2.style.transform = `translateY(${(1 - done) * 40}px)`;
  }
  const chk = s2.querySelector('.check');
  if (chk) chk.style.transform = `scale(${t < 4.3 ? 0 : back(seg(t, 4.35, 4.85))})`;
  // reseña: las estrellas se encienden una por una antes de publicar
  if (STARS) STARS.innerHTML = [0, 1, 2, 3, 4].map(i => star(t > 3.0 + i * .12)).join('');
};
window.__ready = document.fonts.ready.then(() => Promise.all([...document.images].filter(i => i.getAttribute('src')).map(i => i.decode().catch(() => {}))));
renderAt(0);
</script>
