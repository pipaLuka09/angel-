<title>Tap Work Clientes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F4EFE6; --surface:#FBFAF7; --raised:#FFFFFF; --ink:#0B0E14; --mut:#646A78; --line:#E2DBCE;
  --chip:#EBE4D7; --accent:#EC3013; --accent-ink:#FFFFFF; --ok:#16803C; --warn:#B4520A;
  --shadow:0 1px 2px rgba(11,14,20,.06),0 8px 24px rgba(11,14,20,.08);
  --map-filter:none; --scrim:rgba(11,14,20,.35); --mapbg:#E9E5DC;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --surface:#141820; --raised:#1A1F29; --ink:#F1ECE3; --mut:#9BA2B0; --line:#262C37;
  --chip:#202631; --accent:#FF4A2B; --accent-ink:#FFFFFF; --ok:#3DBE6B; --warn:#F0A04B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --map-filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.7); --scrim:rgba(0,0,0,.55); --mapbg:#1B1E22;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#141820; --raised:#1A1F29; --ink:#F1ECE3; --mut:#9BA2B0; --line:#262C37;
  --chip:#202631; --accent:#FF4A2B; --accent-ink:#FFFFFF; --ok:#3DBE6B; --warn:#F0A04B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --map-filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.7); --scrim:rgba(0,0,0,.55); --mapbg:#1B1E22;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.app{display:flex;flex-direction:column;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}

/* encabezado */
.top{display:flex;align-items:center;gap:14px;padding-block:10px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.08em;font-size:15px;white-space:nowrap}
.brand svg{width:26px;height:22px;flex:none}
.brand b{color:var(--accent);font-weight:800}
.brand small{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;letter-spacing:0;font-size:19px;color:var(--mut);margin-left:2px}
.kpis{display:flex;gap:18px;margin-left:auto;align-items:baseline}
.kpi{display:flex;flex-direction:column;line-height:1.05}
.kpi b{font-weight:850;font-stretch:78%;font-size:22px;letter-spacing:-.01em}
.kpi span{color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:9px 15px;font-weight:700;font-size:14px;background:var(--chip);color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.pin:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* leyenda / filtros por etapa */
.legend{display:flex;gap:6px;overflow-x:auto;padding-block:8px;border-bottom:1px solid var(--line);background:var(--surface);scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:5px 10px 5px 6px;font-size:13px;font-weight:600;white-space:nowrap}
.chip i{width:18px;height:18px;border-radius:50%;background:var(--c);color:var(--t);display:grid;place-items:center;font:700 10px/1 "JetBrains Mono",monospace;font-style:normal}
.chip em{font-style:normal;color:var(--mut);font-weight:500}
.chip[aria-pressed="false"]{opacity:.42}
.chip[aria-pressed="false"] i{background:transparent;border:1.5px dashed var(--mut);color:var(--mut)}

/* cuerpo */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 420px;grid-template-rows:minmax(0,1fr)}
.mapwrap{position:relative;isolation:isolate;overflow:hidden;background:var(--mapbg);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.mapwrap.dragging{cursor:grabbing}
.mapwrap.placing{cursor:crosshair}
#mapimg{position:absolute;left:0;top:0;transform-origin:0 0;filter:var(--map-filter);pointer-events:none;max-width:none;image-rendering:auto}
#pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;border:0;background:none;padding:0 0 8px;pointer-events:auto;will-change:transform}
.pin .tag{position:relative;display:flex;align-items:center;gap:5px;background:var(--c);color:var(--t);border:2px solid #fff;border-radius:999px;padding:2px;
  box-shadow:0 2px 6px rgba(0,0,0,.28);font:700 12px/1 Archivo,sans-serif;white-space:nowrap}
.pin .tag::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--c);border-right:2px solid #fff;border-bottom:2px solid #fff;transform:translateX(-50%) rotate(45deg);border-bottom-right-radius:2px}
.pin .n{width:18px;height:18px;display:grid;place-items:center;font:700 10px/1 "JetBrains Mono",monospace}
.pin .l{display:none;padding-right:7px;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.labels .pin .l,.pin.sel .l{display:block}
.pin.sel{z-index:5}
.pin.sel .tag{transform:scale(1.12);box-shadow:0 0 0 4px rgba(236,48,19,.25),0 4px 12px rgba(0,0,0,.35)}
.pin.due .tag::before{content:"!";position:absolute;top:-7px;right:-7px;width:15px;height:15px;border-radius:50%;background:#0B0E14;color:#fff;border:2px solid #fff;font:800 9px/11px Archivo,sans-serif;text-align:center}
.pin.dim{opacity:.35}

.mapctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--raised);box-shadow:var(--shadow);font-size:20px;font-weight:600;display:grid;place-items:center}
.mapctl svg{width:18px;height:18px}
.attrib{position:absolute;right:6px;bottom:4px;font-size:10px;color:#333;background:rgba(255,255,255,.75);padding:1px 5px;border-radius:4px}
.placebar{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:999px;box-shadow:var(--shadow);font-weight:600;font-size:14px;max-width:calc(100% - 90px)}
.placebar .btn{background:var(--bg);color:var(--ink);padding:6px 12px}

/* panel */
.panel{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--surface);position:relative}
.tabs{display:flex;gap:4px;padding-block:10px 0}
.tab{border:0;background:none;padding:8px 12px;border-radius:10px 10px 0 0;font-weight:700;font-size:14px;color:var(--mut);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab em{font-style:normal;font-weight:600;font-size:12px;background:var(--chip);border-radius:999px;padding:1px 7px;margin-left:4px}
.tab.hot em{background:var(--accent);color:var(--accent-ink)}
.search{padding-block:10px;border-bottom:1px solid var(--line)}
.search input{width:100%;border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:9px 12px;outline:none}
.search input:focus{border-color:var(--accent)}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:4px 24px}
.grp{margin-top:14px;display:flex;align-items:baseline;gap:8px;color:var(--mut)}
.grp b{color:var(--ink);font-size:13px}
.card{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--raised);border-radius:14px;padding:10px 12px;margin-top:8px}
.card:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.card .dot{grid-row:span 3;width:24px;height:24px;border-radius:50%;background:var(--c);color:var(--t);display:grid;place-items:center;font:700 11px/1 "JetBrains Mono",monospace;margin-top:1px}
.card .nm{font-weight:750;font-size:15px;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{color:var(--mut);font-size:13px;min-width:0}
.card .nx{font-size:13px;min-width:0;display:flex;gap:6px;align-items:baseline}
.card .nx b{font-weight:700}
.late{color:var(--accent);font-weight:700}
.empty{padding:28px 4px;color:var(--mut);text-align:center}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

.funnel{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.frow{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;border:0;background:none;padding:0;text-align:left;width:100%}
.frow .bar{height:26px;border-radius:7px;background:var(--chip);position:relative;overflow:hidden}
.frow .bar i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:7px;min-width:4px}
.frow .bar span{position:absolute;left:8px;top:50%;transform:translateY(-50%);font:700 12px/1 "JetBrains Mono",monospace;color:var(--ink);mix-blend-mode:normal}
.frow .nm{font-weight:650;font-size:14px}
.frow .v{font-weight:700;font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.ftot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.ftot div{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--raised)}
.ftot b{display:block;font-weight:850;font-stretch:78%;font-size:28px;line-height:1}

/* detalle */
.detail{position:absolute;inset:0;background:var(--surface);display:flex;flex-direction:column;z-index:20}
.dhead{display:flex;align-items:flex-start;gap:10px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-weight:850;font-stretch:84%;font-size:24px;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.dhead .sub{color:var(--mut);font-size:13px;margin-top:3px}
.x{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--raised);font-size:18px;display:grid;place-items:center}
.dbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:12px 40px;display:flex;flex-direction:column;gap:18px}
.sect h3{margin:0 0 8px;font-size:11px}
.sect h3.mono{color:var(--mut)}
.steps{display:flex;gap:4px}
.steps button{flex:1;min-width:0;border:0;border-radius:8px;padding:7px 2px 6px;background:var(--chip);font-size:11px;font-weight:700;line-height:1.1;color:var(--mut)}
.steps button.on{background:var(--c);color:var(--t)}
.steps button.cur{outline:2px solid var(--ink);outline-offset:1px}
.endst{display:flex;gap:6px;margin-top:6px}
.endst button{flex:1;border:1px dashed var(--line);background:none;border-radius:8px;padding:7px;font-size:13px;font-weight:700;color:var(--mut)}
.endst button.cur{border-style:solid;background:var(--c);color:var(--t);border-color:var(--c)}

.reco{border-radius:18px;background:var(--ink);color:var(--bg);padding:16px 16px 14px;position:relative}
.reco .k{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.reco h4{margin:4px 0 0;font-size:19px;font-weight:800;line-height:1.15;text-wrap:balance}
.reco q{display:block;font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:22px;line-height:1.18;margin-top:10px;quotes:"“" "”"}
.reco p{margin:10px 0 0;font-size:14px;color:color-mix(in srgb,var(--bg) 78%,transparent)}
.reco .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.reco .btn{background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg)}
.reco .btn.pri{background:var(--accent);color:var(--accent-ink)}
.reco.won{background:var(--ok);color:#fff}
.reco.won .k,.reco.won p{color:rgba(255,255,255,.82)}
.reco.won .btn{background:rgba(255,255,255,.18);color:#fff}

.checks{display:flex;flex-direction:column;gap:2px}
.ck{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.ck input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.ck.next span{font-weight:750}
.ck.next span::after{content:"  ← ahora";font:700 10px "JetBrains Mono",monospace;color:var(--accent);letter-spacing:.04em}
.ck.done span{color:var(--mut);text-decoration:line-through;text-decoration-thickness:1px}

.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:9px 11px;font-size:15px;color:var(--ink);outline:none;width:100%;min-width:0}
label.f input:focus,label.f textarea:focus,label.f select:focus{border-color:var(--accent)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a,.links button{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.links svg{width:15px;height:15px}
.val{display:flex;align-items:baseline;gap:8px;margin-top:8px;font-size:13px;color:var(--mut)}
.val b{font-weight:850;font-stretch:78%;font-size:24px;color:var(--ink)}
.notes{display:flex;flex-direction:column;gap:8px}
.note{border-left:2px solid var(--line);padding:2px 0 2px 10px;font-size:14px}
.note small{display:block;color:var(--mut);font-size:11px}
.addnote{display:flex;gap:8px}
.addnote input{flex:1;min-width:0;border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:9px 11px;outline:none}
.danger{color:var(--accent);background:none;border:0;font-weight:700;padding:6px 0;font-size:13px}
.warnbar{background:var(--warn);color:#fff;font-size:13px;padding-block:6px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;transition:.25s;pointer-events:none;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.nav{display:none}

/* teléfono */
@media (max-width:900px){
  .main{grid-template-columns:1fr}
  .panel{border-left:0}
  .app[data-view="mapa"] .panel{position:fixed;z-index:50;width:0;height:0;border:0;overflow:visible}
  .app[data-view="mapa"] .panel>:not(.detail){display:none}
  .app:not([data-view="mapa"]) .mapwrap{display:none}
  .tabs{display:none}
  .kpis{gap:12px}
  .kpi b{font-size:18px}
  .top .btn.pri{display:none}
  .nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-block:4px}
  .nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--mut);position:relative}
  .nav button svg{width:22px;height:22px}
  .nav button[aria-selected="true"]{color:var(--ink)}
  .nav button em{position:absolute;top:2px;left:calc(50% + 6px);font-style:normal;background:var(--accent);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;line-height:15px}
  .nav .plus span{width:40px;height:30px;border-radius:999px;background:var(--accent);color:#fff;display:grid;place-items:center}
  .detail{position:fixed;z-index:50;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .frow{grid-template-columns:100px 1fr auto}
}
@media (max-width:520px){
  .kpi.hide-s{display:none}
  .brand small{display:none}
}
</style>

<div class="app" id="app" data-view="mapa">
  <header class="top gut">
    <div class="brand" aria-label="Tap Work">
      <svg viewBox="0 0 26 22" fill="none" aria-hidden="true"><rect x="1" y="3" width="15" height="16" rx="3" stroke="currentColor" stroke-width="2"/><path d="M19 6.5a6 6 0 0 1 0 9M22.5 3.5a10.5 10.5 0 0 1 0 15" stroke="#EC3013" stroke-width="2" stroke-linecap="round"/></svg>
      <span>TAP <b>WORK</b></span><small>clientes</small>
    </div>
    <div class="kpis">
      <div class="kpi"><b id="kDue">0</b><span class="mono">Pendientes</span></div>
      <div class="kpi"><b id="kOpen">$0</b><span class="mono">En juego</span></div>
      <div class="kpi hide-s"><b id="kWon">0</b><span class="mono">Clientes</span></div>
      <button class="btn pri" data-act="new">+ Nuevo</button>
    </div>
  </header>
  <div class="warnbar gut" id="warn" hidden></div>
  <nav class="legend gut" id="legend" aria-label="Filtrar por etapa"></nav>

  <div class="main">
    <section class="mapwrap" id="map" aria-label="Mapa de clientes en Machala">
      <img id="mapimg" src="machala.jpg" width="2304" height="2544" alt="" draggable="false">
      <div id="pins"></div>
      <div class="mapctl">
        <button data-act="zin" aria-label="Acercar">+</button>
        <button data-act="zout" aria-label="Alejar">−</button>
        <button data-act="fit" aria-label="Ver todos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="placebar" id="placebar" hidden><span>Toca el local en el mapa</span><button class="btn" data-act="cancelplace">Cancelar</button></div>
      <div class="attrib">© OpenStreetMap contributors</div>
    </section>

    <aside class="panel" id="panel">
      <div class="tabs gut" role="tablist">
        <button class="tab" role="tab" data-tab="hoy">Pendientes<em id="tDue">0</em></button>
        <button class="tab" role="tab" data-tab="lista">Todos<em id="tAll">0</em></button>
        <button class="tab" role="tab" data-tab="embudo">Embudo</button>
      </div>
      <div class="search gut" id="searchbox"><input id="q" type="search" placeholder="Buscar negocio, sector o teléfono" autocomplete="off"></div>
      <div class="scroll gut" id="list"></div>
      <div class="detail" id="detail" hidden></div>
    </aside>
  </div>

  <nav class="nav gut" id="nav">
    <button data-view="mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Mapa</button>
    <button data-view="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>Pendientes<em id="nDue" hidden>0</em></button>
    <button class="plus" data-act="new" aria-label="Nuevo cliente"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Nuevo</button>
    <button data-view="lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Todos</button>
    <button data-view="embudo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 4h18l-7 8v6l-4 2v-8L3 4z"/></svg>Embudo</button>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
/* ───────────── datos fijos ───────────── */
// Mapa base: captura de OpenStreetMap a zoom 16 (Web Mercator). gx0/gy0 = píxel global de la esquina superior izquierda.
const MAP = {w: 2304, h: 2544, n: 256 * 2 ** 16, gx0: 4661503.877255111, gy0: 8539555.140298681};
const toXY = (lat, lng) => ({
  x: (lng + 180) / 360 * MAP.n - MAP.gx0,
  y: (1 - Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) / Math.PI) / 2 * MAP.n - MAP.gy0,
});
const fromXY = (x, y) => ({
  lng: (x + MAP.gx0) / MAP.n * 360 - 180,
  lat: Math.atan(Math.sinh(Math.PI * (1 - 2 * (y + MAP.gy0) / MAP.n))) * 180 / Math.PI,
});

const addDays = (s, k) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + k); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fmtDate = s => { if (!s) return ''; const t = todayStr(); if (s === t) return 'hoy'; if (s === addDays(t, 1)) return 'mañana'; if (s === addDays(t, -1)) return 'ayer'; const [y, m, d] = s.split('-'); return `${+d} ${MES[m - 1]}`; };
const money = v => '$' + Math.round(v).toLocaleString('es-EC');
const valor = l => Number(l.valor) > 0 ? Number(l.valor) : (l.productos || []).reduce((a, k) => a + (PROD[k]?.v || 0), 0);

const gmaps = l => l.maps || (l.lat != null ? `https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((l.nombre || '') + ' Machala')}`);
function parseCoords(s) {
  s = String(s || '');
  const m = s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || s.match(/(?:q|query|ll|center)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/) || s.match(/^\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/);
  return m ? {lat: +m[1], lng: +m[2]} : null;
}
const inMap = l => { if (l.lat == null || l.lng == null) return false; const p = toXY(l.lat, l.lng); return p.x >= 0 && p.y >= 0 && p.x <= MAP.w && p.y <= MAP.h; };

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

/* ───────────── almacenamiento (db compartida; memoria si no hay) ───────────── */
const leads = new Map();
let col = null, readOnly = false;
const queue = new Map(); // id -> {patch, running}

function deepMerge(a, b) {
  const o = {...a};
  for (const [k, v] of Object.entries(b)) o[k] = v && typeof v === 'object' && !Array.isArray(v) && a?.[k] && typeof a[k] === 'object' && !Array.isArray(a[k]) ? deepMerge(a[k], v) : v;
  return o;
}
function save(id, patch) {
  patch = {...patch, actualizado: new Date().toISOString()};
  leads.set(id, deepMerge(leads.get(id) || {}, patch));
  renderAll({keepDetail: true});
  if (!col) return;
  const q = queue.get(id) || {patch: {}, running: false};
  q.patch = deepMerge(q.patch, patch);
  queue.set(id, q);
  flush(id);
}
async function flush(id) {
  const q = queue.get(id);
  if (!q || q.running || !Object.keys(q.patch).length) return;
  const patch = q.patch; q.patch = {}; q.running = true;
  try { await col.doc(id).update(patch); }
  catch (e) { onWriteError(e); }
  q.running = false;
  if (Object.keys(q.patch).length) flush(id); else queue.delete(id);
}
async function create(data) {
  const now = new Date().toISOString();
  data = {creado: now, actualizado: now, etapa: 'nuevo', productos: [], checks: {}, objecion: '', proxima: {fecha: '', accion: ''}, notas: [], ...data};
  if (col) {
    const ref = col.doc();
    leads.set(ref.id, data);
    try { await ref.set(data); } catch (e) { leads.delete(ref.id); onWriteError(e); return null; }
    return ref.id;
  }
  const id = 'm' + Date.now().toString(36);
  leads.set(id, data);
  return id;
}
async function removeLead(id) {
  leads.delete(id);
  renderAll();
  if (col) try { await col.doc(id).delete(); } catch (e) { onWriteError(e); }
}
function onWriteError(e) {
  if (e?.code === 'invalid_argument' || e?.code === 'not_granted') { readOnly = true; showWarn('Solo puedes ver esta lista; no tienes permiso para guardar cambios.'); }
  else if (e?.code === 'quota_exceeded') toast('La base de datos está llena: borra clientes perdidos antiguos.');
  else toast('No se pudo guardar. Revisa tu conexión e inténtalo otra vez.');
}
function showWarn(msg) { const w = $('#warn'); w.textContent = msg; w.hidden = false; }

/* ───────────── mapa: pan / zoom / pines ───────────── */
const mapEl = $('#map'), img = $('#mapimg'), pinsEl = $('#pins');
let s = .3, tx = 0, ty = 0, vw = 0, vh = 0;
const minS = () => Math.max(vw / MAP.w, vh / MAP.h), maxS = 2.4;
function clampView() {
  s = Math.max(minS(), Math.min(maxS, s));
  const W = MAP.w * s, H = MAP.h * s;
  tx = W <= vw ? (vw - W) / 2 : Math.min(0, Math.max(vw - W, tx));
  ty = H <= vh ? (vh - H) / 2 : Math.min(0, Math.max(vh - H, ty));
}
let raf = 0;
function paint() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; applyView(); }); }
function applyView() {
  if (!vw || !vh) return;
  clampView();
  img.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
  mapEl.classList.toggle('labels', s >= .75);
  for (const [id, el] of pinEls) {
    const l = leads.get(id); if (!l) continue;
    const p = toXY(l.lat, l.lng);
    el.style.transform = `translate(${p.x * s + tx}px,${p.y * s + ty}px) translate(-50%,-100%)`;
  }
}
function zoomAt(f, cx, cy) {
  const ns = Math.max(minS(), Math.min(maxS, s * f));
  tx = cx - (cx - tx) * ns / s; ty = cy - (cy - ty) * ns / s; s = ns; paint();
}
function fitTo(list) {
  const pts = list.filter(inMap).map(l => toXY(l.lat, l.lng));
  if (!pts.length) { s = minS(); tx = 0; ty = 0; paint(); return; }
  let x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x)), y0 = Math.min(...pts.map(p => p.y)), y1 = Math.max(...pts.map(p => p.y));
  const padd = 70;
  s = Math.min(maxS * .5, (vw - padd * 2) / Math.max(1, x1 - x0), (vh - padd * 2) / Math.max(1, y1 - y0));
  s = Math.max(minS(), s);
  tx = vw / 2 - (x0 + x1) / 2 * s; ty = vh / 2 - (y0 + y1) / 2 * s + 16; paint();
}
function centerOn(l, zoom) {
  if (!inMap(l)) return;
  const p = toXY(l.lat, l.lng);
  if (zoom) s = Math.max(s, zoom);
  clampView();
  tx = vw / 2 - p.x * s; ty = vh / 2 - p.y * s; paint();
}
function measure() { const r = mapEl.getBoundingClientRect(); vw = r.width; vh = r.height; }
let fitted = false;
new ResizeObserver(() => { measure(); if (!vw) return; if (!fitted) { fitTo(visibleLeads()); fitted = leads.size > 0; } else paint(); }).observe(mapEl);

const ptrs = new Map(); let last = null, moved = 0, pinchD = 0;
mapEl.addEventListener('pointerdown', e => {
  if (e.target.closest('.mapctl,.placebar')) return;
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (ptrs.size === 1) { last = {x: e.clientX, y: e.clientY}; moved = 0; }
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); }
});
addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (ptrs.size === 1 && last) {
    const dx = e.clientX - last.x, dy = e.clientY - last.y; moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 6) mapEl.classList.add('dragging');
    tx += dx; ty += dy; last = {x: e.clientX, y: e.clientY}; paint();
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); const r = mapEl.getBoundingClientRect();
    moved += 99;
    if (pinchD) zoomAt(d / pinchD, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
    pinchD = d;
  }
});
const endPtr = e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size === 1) { last = [...ptrs.values()][0]; pinchD = 0; }
  if (ptrs.size === 0) {
    mapEl.classList.remove('dragging');

    case 'done': {
      const c = CHECKS.find(x => x.k === b.dataset.k); const patch = {checks: {[c.k]: true}, notas: addNote(l, '✓ ' + c.n)};
      advance(l, c, patch); patchLead(patch); det.querySelector('.dbody').scrollTop = 0; break;
    }
    case 'copy': copyText(det.querySelector('#script').textContent, det.querySelector('#script')); break;
    case 'copytel': copyText(l.tel); break;
    case 'note': {
      const inp = det.querySelector('#noteIn'); const v = inp.value.trim(); if (!v) return;
      inp.value = ''; inp.blur();
      patchLead({notas: addNote(l, v)}); break;
    }
    case 'place': startPlacing(draft ? '__draft' : sel); break;
    case 'askdel':
      det.querySelector('#delbox').innerHTML = `<p style="margin:0 0 8px">¿Borrar <b>${esc(l.nombre)}</b> con todas sus notas? No se puede deshacer.</p><div style="display:flex;gap:8px"><button class="btn pri" data-act="del">Sí, borrar</button><button class="btn" data-act="nodel">Cancelar</button></div>`; break;
    case 'nodel': renderDetail(); break;
    case 'del': { const id = sel; closeDetail(); await removeLead(id); toast('Cliente borrado'); break; }
    case 'create': {
      if (!draft.nombre?.trim()) { toast('Escribe el nombre del negocio'); det.querySelector('[data-f="nombre"]')?.focus(); return; }
      if (readOnly) { toast('Solo lectura: no se guardan cambios.'); return; }
      const d = draft; draft = null;
      const id = await create(d);
      if (id) { toast('Cliente guardado'); openDetail(id); renderAll({keepDetail: true}); if (inMap(leads.get(id))) centerOn(leads.get(id), .9); }
      break;
    }
  }
});
det.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'noteIn') det.querySelector('[data-act="note"]').click(); });
async function copyText(txt, el) {
  try { await navigator.clipboard.writeText(txt); toast('Copiado'); }
  catch { if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast('Mantén presionado para copiar'); }
}

/* ───────────── acciones globales ───────────── */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || det.contains(b)) return;
  const a = b.dataset.act;
  if (a === 'new') { if (placing) stopPlacing(); draft = {nombre: '', productos: [], etapa: 'nuevo'}; openDraft(); }
  else if (a === 'zin') zoomAt(1.5, vw / 2, vh / 2);
  else if (a === 'zout') zoomAt(1 / 1.5, vw / 2, vh / 2);
  else if (a === 'fit') fitTo(visibleLeads());
  else if (a === 'cancelplace') { const id = placeFor; stopPlacing(); if (id === '__draft') openDraft(); else if (id) openDetail(id); }
});
addEventListener('keydown', e => { if (e.key === 'Escape') { if (placing) stopPlacing(); else if (!det.hidden) closeDetail(); } });

function renderAll(opts = {}) {
  renderLegend(); renderList(); renderPins();
  if (!det.hidden && opts.keepDetail !== false) {
    if (draft) return;
    if (sel && !leads.has(sel)) { closeDetail(); return; }
    if (canRerender()) renderDetail();
  }
}

/* ───────────── arranque ───────────── */
if (narrow()) view = 'mapa'; app.dataset.view = view;
renderAll();
let firstSnap = true;
(async () => {
  let db = null;
  try { db = await window.claude?.use?.('db'); } catch {}
  if (!db) { showWarn('Sin conexión a la base de datos: puedes probar la app, pero los cambios no se guardarán.'); return; }
  col = db.collection('leads');
  col.onSnapshot(snap => {
    leads.clear();
    for (const d of snap.docs) leads.set(d.id, d.data());
    // lo que este dispositivo aún está guardando gana sobre lo que llega
    for (const [id, q] of queue) if (leads.has(id) && Object.keys(q.patch).length) leads.set(id, deepMerge(leads.get(id), q.patch));
    renderAll();
    if (firstSnap && snap.size) { firstSnap = false; if (vw) { fitTo(visibleLeads()); fitted = true; } }
  }, err => {
    if (err.code === 'revoked') showWarn('Ya no tienes acceso a esta lista.');
    else showWarn('Se perdió la conexión con la base de datos. Recarga la página.');
  });
})();
})();
</script>
