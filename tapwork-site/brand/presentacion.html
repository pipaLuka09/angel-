<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&display=swap">
<style>
  html,body{margin:0;overflow:hidden;font-family:Archivo,sans-serif}
  .art{position:relative;width:100%;height:100%;display:flex;flex-direction:column;
       align-items:center;overflow:hidden}
  /* oscuro = identidad Tap Work; claro = el aire de la referencia, con el gris
     hueso de la marca en vez del celeste de otra empresa */
  .art.dark { background:radial-gradient(120% 85% at 50% 22%,#1a1d21 0%,#0e1013 55%,#08090b 100%); --ink:#f2f3f4; --dim:#9aa0a8; --card:linear-gradient(168deg,#22262b 0%,#14171a 55%,#0d1013 100%); --edge:rgba(255,255,255,.09); }
  .art.light{ background:radial-gradient(120% 85% at 50% 22%,#ffffff 0%,#f1efec 55%,#e4e0db 100%); --ink:#17181b; --dim:#6d6f75; --card:linear-gradient(168deg,#23272c 0%,#15181c 55%,#0d1013 100%); --edge:rgba(255,255,255,.10); }

  .top{padding:var(--pt) 74px 0;text-align:center;width:100%}
  .eyebrow{font-size:var(--fe);font-weight:700;letter-spacing:.22em;text-transform:uppercase;
           color:#ec3013;margin:0 0 var(--ge)}
  h1{font-size:var(--fh);font-weight:800;letter-spacing:-.035em;line-height:.96;margin:0;
     color:var(--ink);text-transform:uppercase}
  h1 em{font-style:normal;color:#ec3013}

  .stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;position:relative}
  .card{width:var(--cw);height:var(--ch);border-radius:var(--cr);background:var(--card);
        display:grid;place-items:center;position:relative;
        box-shadow:0 var(--sy) var(--sb) rgba(0,0,0,.55), inset 0 1px 0 var(--edge)}
  .card::after{content:"";position:absolute;left:6%;right:6%;bottom:calc(var(--rb) * -1);
               height:var(--rh);border-radius:99px;background:#ec3013}
  .card svg{width:56%;height:auto}

  .foot{padding:0 74px var(--pb);text-align:center;width:100%}
  .wm{font-size:var(--fw);font-weight:800;letter-spacing:-.03em;color:var(--ink);margin:0}
  .tel{font-size:var(--ft);font-weight:700;color:var(--dim);margin:var(--gt) 0 0;letter-spacing:.02em}
</style>
<div class="art" id="art">
  <div class="top">
    <p class="eyebrow">Tecnología NFC · Ecuador</p>
    <h1 id="h"></h1>
  </div>
  <div class="stage"><div class="card" id="c"></div></div>
  <div class="foot">
    <p class="wm">Tap Work</p>
    <p class="tel">Pedidos al 096 779 4882</p>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
const theme = q.get('v') || 'dark';
const fmt = q.get('f') || 'feed';
document.getElementById('art').classList.add(theme);
document.getElementById('h').innerHTML = 'Un toque<br>hace <em>el trabajo</em>';

const S = fmt === 'story'
  ? { pt:'132px', pb:'128px', fe:'27px', ge:'30px', fh:'112px', cw:'560px', ch:'760px',
      cr:'54px', sy:'52px', sb:'86px', rb:'13px', rh:'13px', fw:'56px', ft:'27px', gt:'12px' }
  : { pt:'96px',  pb:'92px',  fe:'25px', ge:'26px', fh:'100px', cw:'520px', ch:'660px',
      cr:'50px', sy:'46px', sb:'78px', rb:'12px', rh:'12px', fw:'52px', ft:'25px', gt:'11px' };
for (const [k, v] of Object.entries(S)) document.documentElement.style.setProperty('--' + k, v);

const ink = theme === 'dark' ? '#f2f3f4' : '#f2f3f4';   // la tarjeta es oscura en ambos
document.getElementById('c').innerHTML = `<svg viewBox="0 0 100 100">
  <rect x="15" y="26" width="48" height="13.5" rx="1.5" fill="${ink}"/>
  <rect x="32.2" y="26" width="13.6" height="45" rx="1.5" fill="${ink}"/>
  <g fill="none" stroke="${ink}" stroke-width="7.5" stroke-linecap="round">
    <path d="M69 37.5a16.5 16.5 0 0 1 0 22"/><path d="M81 30a30 30 0 0 1 0 37"/></g></svg>`;
// La marca va sin su línea roja aquí: la tarjeta ya lleva una en la base y dos
// tan cerca se leen como un error de repetición, no como el motivo de la marca.
</script>
