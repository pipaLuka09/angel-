<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&display=swap">
<style>
 html,body{margin:0;width:1080px;height:1920px;overflow:hidden;
   background:radial-gradient(120% 80% at 50% 40%,#191c20 0%,#0d1013 55%,#08090b 100%);
   font-family:Archivo,sans-serif;color:#f2f3f4}
 .c{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    align-items:center;text-align:center;padding:0 110px;gap:38px}
 .eyebrow{font-size:30px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#ec3013;margin:0}
 h1{font-size:96px;font-weight:800;letter-spacing:-.035em;line-height:1.04;margin:0}
 h1 em{font-style:normal;color:#ec3013}
 .sub{font-size:40px;font-weight:600;color:#9aa0a8;line-height:1.4;margin:0;max-width:820px}
 .rule{width:190px;height:9px;border-radius:5px;background:#ec3013}
 .tel{font-size:44px;font-weight:800;letter-spacing:-.01em;margin:0}
 .mark{display:flex;align-items:center;gap:26px}
 .mark b{font-size:64px;font-weight:800;letter-spacing:-.03em}
</style>
<div class="c" id="c"></div>
<script>
const M = (s) => `<svg viewBox="0 0 100 100" width="${s}" height="${s}">
  <rect x="15" y="26" width="48" height="13.5" rx="1.5" fill="#f2f3f4"/>
  <rect x="32.2" y="26" width="13.6" height="45" rx="1.5" fill="#f2f3f4"/>
  <g fill="none" stroke="#f2f3f4" stroke-width="7.5" stroke-linecap="round">
    <path d="M69 37.5a16.5 16.5 0 0 1 0 22"/><path d="M81 30a30 30 0 0 1 0 37"/></g>
  <rect x="15" y="79" width="70" height="7.5" rx="3.75" fill="#ec3013"/></svg>`;
const CARDS = {
  hook: `<p class="eyebrow">Control de asistencia</p>
         <h1>La hoja de papel se firma a <em>cualquier hora</em>.</h1>`,
  como: `<h1>Cada quien marca con su gafete.</h1>
         <div class="rule"></div>
         <p class="sub">Queda registrada la hora exacta, no la que alguien anotó después.</p>`,
  sin:  `<h1>Sin huella. Sin cámara.</h1>
         <div class="rule"></div>
         <p class="sub">Sin cuadrar una planilla a fin de mes. El reporte se exporta cuando lo necesites.</p>`,
  fin:  `<div class="mark">${M(90)}<b>Tap Work</b></div>
         <h1>Un toque hace <em>el trabajo</em>.</h1>
         <div class="rule"></div>
         <p class="tel">096 779 4882</p>`,
};
document.getElementById('c').innerHTML = CARDS[new URLSearchParams(location.search).get('k') || 'hook'];
</script>
