<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Compositor Tap Work</title>
<link rel="stylesheet" href="fonts-video/local.css">
<style>
/* Lienzo de 1080x1920 a escala 1: lo que se ve aquí es exactamente el cuadro del
   video. Nada se anima con CSS: renderAt(t) calcula cada propiedad a partir del
   tiempo, así cada cuadro se puede capturar las veces que haga falta y sale igual. */
:root{
  --bg:#0b0c0f; --ink:#f2f3f4; --mute:#9aa0a6; --dim:#6b7076; --red:#ec3013;
  --green:#1f9d6a; --mint:#63e6a8; --line:#24282c;
  --sans:'Archivo',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;opacity:0}

/* ── gancho ── */
.hook{padding:0 84px;display:flex;flex-direction:column;justify-content:center}
.hook .q{font-weight:800;font-size:112px;line-height:1.02;letter-spacing:-.038em}
.hook .q .ln{display:block;white-space:nowrap}
.hook .w{display:inline-block;margin-right:.24em}
.hook .last{position:relative;display:inline-block;white-space:nowrap}
.hook .strike{position:absolute;left:-4px;right:-6px;top:56%;height:11px;border-radius:6px;
  background:var(--red);transform-origin:left center}
.hook .sub{margin-top:54px;font-weight:500;font-size:44px;color:var(--mute);letter-spacing:-.01em}

/* ── toque: el clip 3D a sangre ── */
.tap img{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
.tap .shade{position:absolute;left:0;right:0;top:0;height:420px;
  background:linear-gradient(#0b0c0fcc,#0b0c0f00)}

/* ── rótulos con barra roja ── */
.lbl{position:absolute;left:62px;top:118px;display:flex;align-items:stretch;gap:24px}
.lbl .bar{width:9px;border-radius:5px;background:var(--red);flex:none}
.lbl .tx{font-weight:800;font-size:66px;line-height:1.08;letter-spacing:-.03em}
.lbl.box{background:rgba(13,14,17,.86);border-radius:18px;padding:26px 34px 28px 28px;
  box-shadow:0 18px 50px rgba(0,0,0,.35)}

/* ── el teléfono ── */
.phone{position:absolute;left:206px;top:400px;width:668px;height:1330px;border-radius:92px;
  background:#16181a;padding:15px;border:2px solid #2c2f33;
  box-shadow:0 50px 140px rgba(0,0,0,.65), inset 0 0 0 2px #0e0f11}
.screen{position:relative;width:100%;height:100%;border-radius:78px;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 18%,#13201a 0%,#0e1311 55%,#0c0f0e 100%)}
.screen.cool{background:radial-gradient(120% 70% at 50% 18%,#151b22 0%,#0f1216 55%,#0c0e11 100%)}
.screen.warm{background:radial-gradient(120% 70% at 50% 18%,#221813 0%,#140f0d 55%,#0e0c0b 100%)}
.notch{position:absolute;left:50%;top:30px;width:180px;height:48px;margin-left:-90px;
  border-radius:24px;background:#000}
.foot{position:absolute;left:0;right:0;bottom:62px;display:flex;align-items:center;
  justify-content:center;gap:14px;font-weight:700;font-size:30px;color:#d8dbde}
.foot svg{width:40px;height:40px}
.in{position:absolute;left:54px;right:54px;top:150px;display:flex;flex-direction:column;align-items:center;text-align:center}
.in.left{align-items:stretch;text-align:left}

.ic{width:236px;height:236px;border-radius:50%;display:grid;place-items:center;background:var(--green);
  box-shadow:0 0 0 18px rgba(31,157,106,.12)}
.ic svg{width:118px;height:118px}
.h{margin-top:64px;font-weight:800;font-size:76px;letter-spacing:-.03em;line-height:1.05}
.big{margin-top:22px;font-family:var(--mono);font-weight:700;font-size:104px;color:var(--mint);letter-spacing:-.02em}
.nm{margin-top:42px;font-weight:700;font-size:46px;letter-spacing:-.01em}
.meta{margin-top:12px;font-family:var(--mono);font-weight:500;font-size:28px;color:var(--mute);letter-spacing:.02em}
.pill{margin-top:40px;align-self:center;display:inline-flex;align-items:center;gap:12px;padding:16px 30px;border-radius:999px;
  background:rgba(31,157,106,.16);color:var(--mint);font-weight:700;font-size:34px}
.pill i{width:14px;height:14px;border-radius:50%;background:currentColor}
.eyb{font-family:var(--mono);font-weight:500;font-size:26px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.ttl{margin-top:14px;font-weight:800;font-size:72px;letter-spacing:-.03em;line-height:1.02}
.rows{margin-top:44px;display:flex;flex-direction:column}
.row{display:flex;align-items:baseline;gap:20px;padding:24px 0;border-top:2px solid var(--line)}
.row:first-child{border-top:0}
.row .a{flex:1;min-width:0}
.row .a b{display:block;font-weight:700;font-size:40px;letter-spacing:-.01em}
.row .a span{display:block;margin-top:6px;font-size:27px;color:var(--mute)}
.row .v{font-family:var(--mono);font-weight:700;font-size:38px;white-space:nowrap}
.row .ok{color:var(--mint);font-size:28px;letter-spacing:.08em}
.row .warn{color:#ff7a5a;font-size:28px;letter-spacing:.08em}
.btn{margin-top:46px;padding:32px;border-radius:26px;text-align:center;font-weight:800;font-size:38px;
  background:var(--ink);color:#0b0c0f}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:transparent;border:3px solid #3a3e43;color:var(--ink)}
.tag{align-self:flex-start;padding:10px 20px;border-radius:8px;background:var(--red);color:#fff;
  font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:.12em}
.alert{margin-top:34px;padding:26px 30px;border-radius:20px;background:#b8240e}
.alert small{display:block;font-family:var(--mono);font-size:24px;letter-spacing:.14em;opacity:.85}
.alert b{display:block;margin-top:6px;font-weight:800;font-size:40px}
.stars{margin-top:46px;display:flex;justify-content:center;gap:16px}
.stars svg{width:96px;height:96px}
.chips{margin-top:40px;display:flex;gap:16px}
.chip{flex:1;padding:26px 0;border-radius:22px;border:3px solid #33373c;text-align:center}
.chip b{display:block;font-weight:800;font-size:40px}
.chip span{display:block;margin-top:4px;font-family:var(--mono);font-size:26px;color:var(--mute)}
.chip.on{border-color:#ff3ea5;background:rgba(255,62,165,.12)}
.mono-xl{margin-top:30px;font-family:var(--mono);font-weight:700;font-size:96px;letter-spacing:.06em;color:#4a4f55;position:relative}
.mono-xl .x{position:absolute;left:-10px;right:-10px;top:52%;height:9px;border-radius:5px;background:var(--red);transform-origin:left}
.old{font-family:var(--mono);font-weight:700;font-size:58px;color:#5a5f65;position:relative;display:inline-block}
.old .x{position:absolute;left:-6px;right:-6px;top:52%;height:7px;border-radius:4px;background:var(--red);transform-origin:left}
.mono{font-family:var(--mono)}
.monog{font-family:Georgia,'Times New Roman',serif;font-size:150px;line-height:1;color:#c8a96a;letter-spacing:-.04em}
.serif-name{margin-top:18px;font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:70px;letter-spacing:-.01em}
.radio{width:40px;height:40px;border-radius:50%;border:4px solid #4a4f55;flex:none;align-self:center}
.radio.on{border-color:var(--mint);box-shadow:inset 0 0 0 8px #0e1311;background:var(--mint)}

/* ── cierre ── */
.end{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.end svg.mk{width:230px;height:230px}
.end .brand{margin-top:6px;font-weight:800;font-size:96px;letter-spacing:-.035em}
.end .tl{margin-top:44px;font-weight:800;font-size:66px;letter-spacing:-.03em}
.end .tl em{font-style:normal;color:var(--red)}
.end .sb{margin-top:22px;font-weight:500;font-size:38px;color:var(--mute);max-width:860px;line-height:1.3}
.end .wa{margin-top:70px;padding:26px 64px 30px;border-radius:999px;background:#fff;color:#0b0c0f}
.end .wa small{display:block;font-weight:700;font-size:24px;letter-spacing:.18em;color:#6b7076}
.end .wa b{display:block;margin-top:4px;font-weight:800;font-size:58px;letter-spacing:-.02em}
</style>
</head>

 },

/* ── utilidades de tiempo ── */
function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
function ramp(t,a,b){ return clamp((t-a)/(b-a), 0, 1); }
function out3(p){ return 1 - Math.pow(1-p, 3); }
function back(p){ var c=1.55; return 1 + (c+1)*Math.pow(p-1,3) + c*Math.pow(p-1,2); }

var KEY = new URLSearchParams(location.search).get('k') || 'menu';
var D = P[KEY];
var stage = document.getElementById('stage');
var clipImgs = [];

function label(lines, boxed){
  return '<div class="lbl'+(boxed?' box':'')+'"><div class="bar"></div><div class="tx">'
    + lines.map(function(l){ return '<div>'+l+'</div>'; }).join('') + '</div></div>';
}

function build(){
  var lines = D.hook;
  var words = [];
  var q = lines.map(function(ln, i){
    var last = i === lines.length - 1;
    if (last) {
      words.push(null);
      return '<span class="ln"><span class="last" data-w="'+(words.length-1)+'">'+ln+'<span class="strike" id="strike"></span></span></span>';
    }
    return '<span class="ln">' + ln.split(' ').map(function(w){
      words.push(w); return '<span class="w" data-w="'+(words.length-1)+'">'+w+'</span>';
    }).join('') + '</span>';
  }).join('');

  stage.innerHTML =
    '<div class="scene hook" id="s-hook"><div class="q">'+q+'</div><div class="sub" id="hsub">Hay una forma más simple.</div></div>'
  + '<div class="scene tap" id="s-tap"><img id="clip" alt=""><div class="shade"></div>'+label([D.tap], true)+'</div>'
  + '<div class="scene" id="s-r1">'+label(D.r1.l)+'<div class="phone"><div class="screen '+D.r1.s+'"><div class="notch"></div>'+D.r1.h+FOOT+'</div></div></div>'
  + '<div class="scene" id="s-r2">'+label(D.r2.l)+'<div class="phone"><div class="screen '+D.r2.s+'"><div class="notch"></div>'+D.r2.h+FOOT+'</div></div></div>'
  + '<div class="scene end" id="s-end">'+MARK
  + '<div class="brand" id="e1">Tap Work</div>'
  + '<div class="tl" id="e2">Un toque hace <em>el trabajo</em>.</div>'
  + '<div class="sb" id="e3">'+D.end+'</div>'
  + '<div class="wa" id="e4"><small>ESCRÍBENOS POR WHATSAPP</small><b>096 779 4882</b></div></div>';
}

function preload(){
  var ps = [];
  for (var i = 1; i <= 78; i++){
    var im = new Image();
    im.src = 'frames/'+KEY+'/f'+String(i).padStart(4,'0')+'.jpg';
    clipImgs.push(im);
    ps.push(im.decode().catch(function(){}));
  }
  return Promise.all(ps).then(function(){ return document.fonts.ready; });
}

function sceneOpacity(t, k){
  var s = T[k][0], e = T[k][1];
  var a = (k === 'hook') ? 1 : ramp(t, s, s + XF);
  var b = (k === 'end') ? 1 : 1 - ramp(t, e, e + XF);
  return a * b;
}

function animateInside(scene, t, s){
  [].forEach.call(scene.querySelectorAll('[data-d]'), function(el){
    var d = parseFloat(el.getAttribute('data-d'));
    var p = out3(ramp(t, s + d, s + d + 0.42));
    el.style.opacity = p;
    el.style.transform = 'translateY(' + ((1-p)*22).toFixed(2) + 'px)';
  });
  [].forEach.call(scene.querySelectorAll('[data-pop]'), function(el){
    var d = parseFloat(el.getAttribute('data-pop'));
    var r = ramp(t, s + d, s + d + 0.5);
    el.style.opacity = clamp(r*2.2, 0, 1);
    el.style.transform = 'scale(' + (0.55 + 0.45*back(r)).toFixed(4) + ')';
    if (!el.style.display) el.style.display = el.tagName === 'SPAN' ? 'inline-block' : '';
  });
  [].forEach.call(scene.querySelectorAll('[data-x]'), function(el){
    var d = parseFloat(el.getAttribute('data-x'));
    el.style.transform = 'scaleX(' + out3(ramp(t, s + d, s + d + 0.38)).toFixed(4) + ')';
  });
}

window.renderAt = function(t){
  ['hook','tap','r1','r2','end'].forEach(function(k){
    document.getElementById('s-'+k).style.opacity = sceneOpacity(t, k).toFixed(4);
  });

  // gancho: palabra por palabra, de borroso a nítido
  [].forEach.call(document.querySelectorAll('#s-hook [data-w]'), function(el){
    var i = parseInt(el.getAttribute('data-w'), 10);
    var p = out3(ramp(t, 0.08 + i*0.07, 0.08 + i*0.07 + 0.5));
    el.style.opacity = p;
    el.style.filter = 'blur(' + ((1-p)*9).toFixed(2) + 'px)';
    el.style.transform = 'translateY(' + ((1-p)*34).toFixed(2) + 'px)';
  });
  document.getElementById('strike').style.transform = 'scaleX(' + out3(ramp(t, 1.45, 1.9)).toFixed(4) + ')';
  var hs = out3(ramp(t, 2.1, 2.6));
  var sub = document.getElementById('hsub');
  sub.style.opacity = hs; sub.style.transform = 'translateY(' + ((1-hs)*18).toFixed(2) + 'px)';

  // toque: el clip 3D cuadro por cuadro; se queda en el último si el bloque es más largo
  var fi = clamp(Math.floor((t - T.tap[0]) * FPS), 0, clipImgs.length - 1);
  var img = document.getElementById('clip');
  if (img.getAttribute('src') !== clipImgs[fi].src) img.src = clipImgs[fi].src;
  var lt = out3(ramp(t, T.tap[0] + 0.15, T.tap[0] + 0.6));
  var lb = document.querySelector('#s-tap .lbl');
  lb.style.opacity = lt; lb.style.transform = 'translateX(' + ((1-lt)*-40).toFixed(2) + 'px)';

  // resultado y beneficio
  ['r1','r2'].forEach(function(k){
    var s = T[k][0], sc = document.getElementById('s-'+k);
    var l = out3(ramp(t, s + 0.1, s + 0.55));
    var lab = sc.querySelector('.lbl');
    lab.style.opacity = l; lab.style.transform = 'translateX(' + ((1-l)*-40).toFixed(2) + 'px)';
    var ph = out3(ramp(t, s + 0.05, s + 0.65));
    var phone = sc.querySelector('.phone');
    phone.style.opacity = ph; phone.style.transform = 'translateY(' + ((1-ph)*90).toFixed(2) + 'px)';
    animateInside(sc, t, s);
  });

  // cierre
  var s = T.end[0];
  var mk = out3(ramp(t, s + 0.12, s + 0.62));
  var m = document.querySelector('#s-end svg.mk');
  m.style.opacity = mk; m.style.transform = 'scale(' + (0.82 + 0.18*mk).toFixed(4) + ')';
  [['e1',.3],['e2',.48],['e3',.62],['e4',.8]].forEach(function(x){
    var p = out3(ramp(t, s + x[1], s + x[1] + 0.45)), el = document.getElementById(x[0]);
    el.style.opacity = p; el.style.transform = 'translateY(' + ((1-p)*24).toFixed(2) + 'px)';
  });
};

window.__total = TOTAL;
window.__ready = (function(){ build(); return preload().then(function(){ window.renderAt(0); return true; }); })();
</script>
