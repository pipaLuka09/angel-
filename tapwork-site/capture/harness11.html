<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent;}</style>
</head>
<body>
<canvas id="tw-acrilico-canvas" width="880" height="883" style="display:block;width:440px;height:auto;"></canvas>
<div id="status" style="position:fixed;top:0;left:0;color:red;font:14px monospace;background:#fff;">loading</div>
<script type="module">
import * as THREE from './three.module.js';
window.THREE = THREE;

// "Acrílico reutilizado": the plain acrylic sign a business already owns, with the
// NFC chip stuck on the back, and a phone reading it. Modelled at the same
// real-world scale as the other scenes (metres) so the shared studio rig fits it.
function studioRig(renderer, scene) {
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.85;

  const env = new THREE.Scene();
  const c = document.createElement("canvas");
  c.width = 8; c.height = 64;
  const cx = c.getContext("2d");
  const grad = cx.createLinearGradient(0, 0, 0, 64);
  grad.addColorStop(0.00, "#ffffff");
  grad.addColorStop(0.42, "#cbd6e0");
  grad.addColorStop(0.70, "#5f686f");
  grad.addColorStop(1.00, "#191c1f");
  cx.fillStyle = grad; cx.fillRect(0, 0, 8, 64);
  env.add(new THREE.Mesh(new THREE.SphereGeometry(30, 24, 16),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), side: THREE.BackSide })));
  const softbox = (w, h, x, y, z, punch) => {
    const m = new THREE.MeshBasicMaterial({ color: 0xffffff });
    m.color.multiplyScalar(punch);
    const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
    p.position.set(x, y, z); p.lookAt(0, 0, 0); env.add(p);
  };
  softbox(15, 11, 8, 13, 10, 3.4);
  softbox(12, 9, -12, 5, -6, 1.4);
  softbox(8, 15, -3, 6, -14, 1.9);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.03).texture;
  pmrem.dispose();

  const KEY_DIR = new THREE.Vector3(0.46, 0.78, 0.55).normalize();
  const key = new THREE.DirectionalLight(0xffffff, 1.75);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.radius = 3;
  key.shadow.bias = -0.0002;
  scene.add(key); scene.add(key.target);
  const fill = new THREE.DirectionalLight(0xe3ecf6, 0.34); fill.position.set(-6, 3, -4); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 0.95); rim.position.set(-3, 5, -9); scene.add(rim);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb9c2cc, 0.22));

  return () => {
    const box = new THREE.Box3(), sph = new THREE.Sphere();
    scene.traverse((o) => {
      if (!o.isMesh) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      let cast = true;
      for (const m of mats) {
        if (!m) continue;
        if (m.isMeshBasicMaterial) cast = false;
        if (m.transparent && m.opacity < 0.55) cast = false;
        if ("envMapIntensity" in m) m.envMapIntensity = 0.85;
      }
      o.castShadow = cast; o.receiveShadow = true;
      if (o.visible) box.expandByObject(o);
    });
    if (box.isEmpty()) return;
    box.getBoundingSphere(sph);
    const r = Math.max(sph.radius, 1e-4);
    key.target.position.copy(sph.center);
    key.position.copy(sph.center).addScaledVector(KEY_DIR, r * 4);
    const sc = key.shadow.camera, half = r * 1.45;
    sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half;
    sc.near = r * 0.5; sc.far = r * 9;
    sc.updateProjectionMatrix();
    key.shadow.normalBias = r * 0.004;
  };
}

function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function extrude(shape, depth, bevel) {
  const g = new THREE.ExtrudeGeometry(shape, bevel
    ? { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 4, curveSegments: 24 }
    : { depth, bevelEnabled: false, curveSegments: 24 });
  g.center();
  return g;
}

function screen() {
  const W = 620, H = 1280;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  x.fillStyle = "#f4f5f7"; x.fillRect(0, 0, W, H);
  x.fillStyle = "#12d6df"; x.fillRect(0, 0, W, 150);
  x.fillStyle = "#04121a"; x.font = "600 30px Arial"; x.textAlign = "left";
  x.fillText("1:04", 34, 58);
  x.textAlign = "right"; x.fillText("NFC", W - 34, 58);
  x.textAlign = "left"; x.font = "800 44px Arial"; x.fillStyle = "#04121a";
  x.fillText("Acrílico actualizado", 34, 122);
  x.fillStyle = "#ffffff"; x.fillRect(34, 200, W - 68, 300);
  x.fillStyle = "#9aa4ad"; x.font = "600 22px Arial";
  x.fillText("CHIP NFC DETECTADO", 60, 260);
  x.fillStyle = "#04121a"; x.font = "800 40px Arial";
  x.fillText("Menú del día", 60, 330);
  x.fillStyle = "#5d6871"; x.font = "400 25px Arial";
  x.fillText("El mismo acrílico de siempre,", 60, 386);
  x.fillText("ahora abre tu menú con un toque.", 60, 424);
  x.fillStyle = "#12d6df"; x.fillRect(34, 540, W - 68, 92);
  x.fillStyle = "#04121a"; x.font = "800 30px Arial"; x.textAlign = "center";
  x.fillText("ABRIR MENÚ", W / 2, 598);
  x.textAlign = "left"; x.fillStyle = "#c9d0d6";
  for (let i = 0; i < 4; i++) x.fillRect(34, 690 + i * 76, W - 68 - (i % 2) * 120, 42);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

const canvas = document.getElementById("tw-acrilico-canvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(440, 441.5, false);
renderer.setPixelRatio(3);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 440 / 441.5, 0.01, 500);
const fitRig = studioRig(renderer, scene);

const M = {
  slab:    new THREE.MeshStandardMaterial({ color: 0xf1f1f0, roughness: 0.55, metalness: 0.03 }),
  edge:    new THREE.MeshStandardMaterial({ color: 0xec3013, roughness: 0.45, metalness: 0.05 }),
  acrylic: new THREE.MeshPhysicalMaterial({ color: 0xeef4f7, roughness: 0.06, metalness: 0.0,
             transparent: true, opacity: 0.26, clearcoat: 1.0, clearcoatRoughness: 0.03,
             envMapIntensity: 1.6 }),
  chip:    new THREE.MeshStandardMaterial({ color: 0xd8873c, roughness: 0.34, metalness: 0.85 }),
  chipPad: new THREE.MeshStandardMaterial({ color: 0x14181c, roughness: 0.72, metalness: 0.12 }),
  body:    new THREE.MeshStandardMaterial({ color: 0x1a1a1c, roughness: 0.38, metalness: 0.55 }),
  glass:   new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.16, metalness: 0.0,
             emissive: 0xffffff, emissiveIntensity: 0.92, emissiveMap: screen(), map: screen() }),
};

const root = new THREE.Group();

// table slab, same language as the other scenes: pale top with a red edge line
const slab = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.015, 0.235), M.slab);
slab.position.y = -0.008; root.add(slab);
const edge = new THREE.Mesh(new THREE.BoxGeometry(0.342, 0.0034, 0.237), M.edge);
edge.position.y = -0.0175; root.add(edge);

// the acrylic the business already owns: clear panel in a clear foot
const panel = new THREE.Mesh(extrude(roundedRect(0.105, 0.148, 0.004), 0.004, 0.0012), M.acrylic);
panel.position.set(-0.066, 0.079, 0.006);
panel.rotation.y = 0.30;
panel.rotation.x = -0.045;   // a little lean, so the softbox lands as a highlight
root.add(panel);
const foot = new THREE.Mesh(extrude(roundedRect(0.115, 0.052, 0.006), 0.006, 0.0015), M.acrylic);
foot.rotation.x = -Math.PI / 2; foot.rotation.z = 0.30;
foot.position.set(-0.066, 0.0035, 0.020);
root.add(foot);

// the upgrade itself: an NFC inlay taped to the back of that same acrylic
const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.019, 0.019, 0.0012, 48), M.chipPad);
pad.rotation.x = Math.PI / 2; pad.rotation.y = 0.30;
pad.position.set(-0.066 + Math.sin(0.30) * 0.004, 0.090, 0.006 - Math.cos(0.30) * 0.004);
root.add(pad);
for (let i = 0; i < 4; i++) {
  const coil = new THREE.Mesh(new THREE.TorusGeometry(0.0055 + i * 0.0034, 0.00055, 8, 56), M.chip);
  coil.rotation.y = 0.30;
  coil.position.copy(pad.position).add(new THREE.Vector3(Math.sin(0.30) * 0.0009, 0, -Math.cos(0.30) * 0.0009));
  root.add(coil);
}

// the phone being tapped against it
const phone = new THREE.Group();
const body = new THREE.Mesh(extrude(roundedRect(0.073, 0.150, 0.011), 0.0092, 0.0022), M.body);
phone.add(body);
// A plain plane, not an extrusion: ExtrudeGeometry emits shape-space UVs, which
// would sample a single corner of the screen texture instead of the whole thing.
const glass = new THREE.Mesh(new THREE.PlaneGeometry(0.0665, 0.1435), M.glass);
glass.position.z = 0.0074; phone.add(glass);
phone.position.set(0.066, 0.081, 0.030);
phone.rotation.set(-0.05, -0.30, 0.02);
root.add(phone);

scene.add(root);

const box = new THREE.Box3().setFromObject(root);
const size = new THREE.Vector3(), center = new THREE.Vector3();
box.getSize(size); box.getCenter(center);
root.position.sub(center);
const radius = Math.max(Math.hypot(size.x, size.z) / 2, size.y / 2);
const dist = (radius / Math.tan((camera.fov * Math.PI / 180) / 2)) * 1.06;
camera.position.set(dist * 0.42, dist * 0.46, dist * 0.80);
camera.lookAt(0, -size.y * 0.04, 0);

fitRig();
renderer.render(scene, camera);
requestAnimationFrame(() => { fitRig(); renderer.render(scene, camera); window.__mounted = true;
  document.getElementById('status').remove(); });
</script>
</body>
</html>
